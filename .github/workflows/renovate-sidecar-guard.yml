name: Guard Renovate sidecar-only updates

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - localApps
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing Renovate PR number to evaluate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    if: >
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.state == 'open' &&
        (
          github.event.pull_request.user.login == 'app/renovate' ||
          github.event.pull_request.user.login == 'renovate[bot]' ||
          (
            github.event.pull_request.head.repo.full_name == github.repository &&
            (
              startsWith(github.event.pull_request.head.ref, 'renovate/') ||
              startsWith(github.event.pull_request.head.ref, 'selfhosted-renovate/')
            )
          )
        )
      ) || (
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Ensure PyYAML is available
        run: |
          python3 - <<'PY'
          import importlib.util
          import subprocess
          import sys

          if importlib.util.find_spec("yaml") is None:
              subprocess.check_call([sys.executable, "-m", "pip", "install", "--user", "pyyaml"])
          PY

      - name: Test sidecar guard policy logic
        run: python3 .github/scripts/test_renovate_sidecar_guard.py

      - name: Evaluate Renovate PR against primary-service policy
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/renovate_sidecar_guard.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number || inputs.pr_number }}" \
            --policy-file .github/renovate-primary-services.json \
            > /tmp/renovate-sidecar-guard.json

          cat /tmp/renovate-sidecar-guard.json
          echo "decision=$(jq -r '.decision' /tmp/renovate-sidecar-guard.json)" >> "$GITHUB_OUTPUT"

      - name: Comment on auxiliary-only update for manual review
        if: steps.guard.outputs.decision == 'review'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "$REPO" \
            --body "Keeping this auxiliary-only image update open for manual review. Validate the complete service stack and old-to-new upgrade impact before merging. Current app-version automation derives package versions from primary service images, so it cannot represent this change as a primary-version bump."

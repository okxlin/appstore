name: Update app version in Renovate PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - localApps
    paths:
      - 'apps/**/docker-compose.yml'
  workflow_dispatch:
    inputs:
      manual-trigger:
        description: 'Manually trigger Renovate'
        default: ''

permissions:
  contents: write

jobs:
  update-app-version:
    if: >
      (
        startsWith(github.event.pull_request.head.ref || github.ref_name, 'renovate/') ||
        startsWith(github.event.pull_request.head.ref || github.ref_name, 'selfhosted-renovate/')
      ) &&
      (
        github.event_name != 'pull_request_target' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Configure repo
        run: |
          git config --local user.email "githubaction@githubaction.com"
          git config --local user.name "github-action update-app-version"

      - name: Find changed Compose files
        id: updated-files
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            base_ref="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0+$ ]]; then
            base_ref="$EVENT_BEFORE"
          else
            git fetch origin localApps
            base_ref=$(git merge-base origin/localApps HEAD)
          fi
          git cat-file -e "${base_ref}^{commit}"
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          git diff --name-only -z "$base_ref" HEAD > "$RUNNER_TEMP/changed-files.zlist"

      - name: Checkout trusted version updater
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.updated-files.outputs.base_ref }}
          path: trusted-helper
          fetch-depth: 1
          persist-credentials: false

      - name: Run renovate-app-version.sh on updated files
        env:
          BASE_REF: ${{ steps.updated-files.outputs.base_ref }}
        run: |
          while IFS= read -r -d '' file; do
            if [[ $file =~ ^apps/([^/]+)/([^/]+)/docker-compose\.yml$ ]]; then
              app_name="${BASH_REMATCH[1]}"
              old_version="${BASH_REMATCH[2]}"
              bash "$GITHUB_WORKSPACE/trusted-helper/.github/workflows/renovate-app-version.sh" \
                "$app_name" \
                "$old_version" \
                "$file" \
                "$BASE_REF"
            fi
          done < "$RUNNER_TEMP/changed-files.zlist"

      - name: Commit & Push Changes
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git check-ref-format --branch "$BRANCH_NAME"
          git add apps
          if git diff --cached --quiet; then
            echo "No app-version directory changes to commit."
            exit 0
          fi
          git config --local user.email "githubaction@githubaction.com"
          git config --local user.name "github-action update-app-version"
          git commit -m "Update app version [skip ci]" --no-verify
          git push origin "HEAD:refs/heads/$BRANCH_NAME"

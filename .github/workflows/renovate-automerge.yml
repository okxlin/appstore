name: Renovate automerge for whitelisted apps

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - localApps
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to re-check and merge if eligible
        required: true
        type: string

concurrency:
  group: renovate-automerge-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.state == 'open' &&
        (
          github.event.pull_request.user.login == 'app/renovate' ||
          github.event.pull_request.user.login == 'renovate[bot]' ||
          (
            github.event.pull_request.head.repo.full_name == github.repository &&
            (
              startsWith(github.event.pull_request.head.ref, 'renovate/') ||
              startsWith(github.event.pull_request.head.ref, 'selfhosted-renovate/')
            )
          )
        )
      ) || (
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Renovate PR identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pull_json=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          if ! jq -e --arg repo "$REPO" '
            (.user.login == "renovate[bot]" or .user.login == "app/renovate") and
            .state == "open" and
            (.draft | not) and
            .base.ref == "localApps" and
            .base.repo.full_name == $repo and
            .head.repo.full_name == $repo and
            ((.head.ref | startswith("renovate/")) or
             (.head.ref | startswith("selfhosted-renovate/")))
          ' <<< "$pull_json" > /dev/null; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Verify changed files stay within whitelist
        id: whitelist
        if: steps.identity.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          mapfile -t apps < <(sed '/^\s*#/d;/^\s*$/d' .github/renovate-automerge-whitelist.txt)
          mapfile -t files < <(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')

          if [ ${#apps[@]} -eq 0 ] || [ ${#files[@]} -eq 0 ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          allowed=true
          printf 'Whitelisted apps:\n'
          printf -- '- %s\n' "${apps[@]}"
          printf 'Changed files:\n'

          for file in "${files[@]}"; do
            echo "- $file"


            if [[ "$file" =~ ^apps/([^/]+)/ ]]; then
              app_name="${BASH_REMATCH[1]}"
              matched=false
              for allowed_app in "${apps[@]}"; do
                if [[ "$app_name" == "$allowed_app" ]]; then
                  matched=true
                  break
                fi
              done
              if [[ "$matched" == false ]]; then
                allowed=false
              fi
            else
              allowed=false
            fi
          done

          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

      - name: Verify PR is a single-service image-only update
        id: shape
        if: steps.identity.outputs.allowed == 'true' && steps.whitelist.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          BASE_SHA=$(gh api "repos/$REPO/git/ref/heads/localApps" --jq '.object.sha')
          HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate > /tmp/renovate-pr-files.json
          python3 - <<'PYAML'
          import importlib.util
          import subprocess
          import sys

          if importlib.util.find_spec("yaml") is None:
              subprocess.check_call([sys.executable, "-m", "pip", "install", "--user", "pyyaml"])
          PYAML

          set +e
          python3 "$GITHUB_WORKSPACE/.github/scripts/renovate_automerge_shape.py" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --files-json /tmp/renovate-pr-files.json \
            --output-json /tmp/renovate-shape.json \
            > /tmp/renovate-shape.stdout \
            2> /tmp/renovate-shape.stderr
          shape_exit=$?
          set -e

          if [ "$shape_exit" -eq 0 ]; then
            cat /tmp/renovate-shape.stdout
            digest_only=$(awk -F= '/^digest_only=/{print $2}' /tmp/renovate-shape.stdout)
            if [[ "$digest_only" != "true" && "$digest_only" != "false" ]]; then
              echo "shape verifier did not report digest_only" >&2
              exit 1
            fi
            {
              echo "allowed=true"
              echo "digest_only=$digest_only"
              echo "base_sha=$BASE_SHA"
              echo "head_sha=$HEAD_SHA"
            } >> "$GITHUB_OUTPUT"
          elif [ "$shape_exit" -eq 42 ]; then
            cat /tmp/renovate-shape.stderr
            {
              echo 'reason<<EOF'
              cat /tmp/renovate-shape.stderr
              echo 'EOF'
              echo "allowed=false"
            } >> "$GITHUB_OUTPUT"
          else
            cat /tmp/renovate-shape.stderr >&2 || true
            exit "$shape_exit"
          fi

      - name: Add marker label for eligible PR
        if: steps.identity.outputs.allowed == 'true' && steps.whitelist.outputs.allowed == 'true' && steps.shape.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr edit "$PR_NUMBER" \
            --repo "$REPO" \
            --add-label renovate-auto

      - name: Check commits for app-version update marker
        id: marker
        if: steps.identity.outputs.allowed == 'true' && steps.whitelist.outputs.allowed == 'true' && steps.shape.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
          VERIFIED_BASE_SHA: ${{ steps.shape.outputs.base_sha }}
          VERIFIED_HEAD_SHA: ${{ steps.shape.outputs.head_sha }}
        run: |
          if [ "${{ steps.shape.outputs.digest_only }}" = "true" ]; then
            echo "Digest-only image update; app-version marker is not required"
            echo "found=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          found=false
          for attempt in 1 2 3 4 5; do
            PULL_COMMITS=$(gh api "repos/$REPO/pulls/$PR_NUMBER/commits" --paginate --jq '.[].commit.message' || true)
            BASE_SHA=$(gh api "repos/$REPO/git/ref/heads/localApps" --jq '.object.sha' || true)
            HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha' || true)
            if [ "$BASE_SHA" != "$VERIFIED_BASE_SHA" ]; then
              echo "localApps moved after shape verification; waiting for a fresh gate run." >&2
              exit 1
            fi
            if [ "$HEAD_SHA" != "$VERIFIED_HEAD_SHA" ]; then
              echo "PR head changed after shape verification; waiting for a fresh gate run." >&2
              exit 1
            fi
            COMPARE_COMMITS=""
            if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
              COMPARE_COMMITS=$(gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" --jq '.commits[].commit.message' || true)
            fi

            echo "== attempt $attempt pull commits =="
            echo "$PULL_COMMITS"
            echo "== attempt $attempt compare commits =="
            echo "$COMPARE_COMMITS"

            ALL_COMMITS="$(printf '%s\n%s\n' "$PULL_COMMITS" "$COMPARE_COMMITS")"

            if echo "$ALL_COMMITS" | grep -Fq "Update app version [skip ci]"; then
              found=true
              break
            fi

            if [ "$attempt" -lt 5 ]; then
              sleep 5
            fi
          done

          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Merge PR
        if: steps.identity.outputs.allowed == 'true' && steps.whitelist.outputs.allowed == 'true' && steps.shape.outputs.allowed == 'true' && steps.marker.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
          VERIFIED_BASE_SHA: ${{ steps.shape.outputs.base_sha }}
          VERIFIED_HEAD_SHA: ${{ steps.shape.outputs.head_sha }}
        run: |
          LIVE_BASE_SHA=$(gh api "repos/$REPO/git/ref/heads/localApps" --jq '.object.sha')
          LIVE_HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$LIVE_BASE_SHA" != "$VERIFIED_BASE_SHA" ] || [ "$LIVE_HEAD_SHA" != "$VERIFIED_HEAD_SHA" ]; then
            echo "PR or base changed after shape verification; waiting for a fresh gate run." >&2
            exit 1
          fi

          set +e
          MERGE_OUTPUT=$(gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --match-head-commit "$VERIFIED_HEAD_SHA" \
            --merge \
            --delete-branch=false 2>&1)
          MERGE_EXIT=$?
          set -e

          echo "$MERGE_OUTPUT"
          if [ "$MERGE_EXIT" -eq 0 ]; then
            exit 0
          fi

          PR_STATE=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state,mergedAt --jq 'if .mergedAt then "MERGED" else .state end' 2>/dev/null || true)
          if [ "$PR_STATE" = "MERGED" ] || [ "$PR_STATE" = "CLOSED" ]; then
            echo "PR already resolved with state: $PR_STATE"
            exit 0
          fi
          if echo "$MERGE_OUTPUT" | grep -Fq "Base branch was modified"; then
            echo "localApps moved during merge; a new gate run is required." >&2
          fi
          exit "$MERGE_EXIT"

services:
  trail:
    image: "trailbase/trailbase:latest@sha256:ad158be961741e1c07cc4168904b77bd8081d5b8ae6e48e58ef26a3b9ebe38ca"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${PANEL_APP_PORT_HTTP}:4000"
    environment:
      - RUST_BACKTRACE=1
    volumes:
      - "${APP_DATA_DIR:-./data}:/app/traildepot"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail http://localhost:4000/api/healthcheck || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

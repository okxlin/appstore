services:
  slack-kasm:
    image: "kasmweb/slack:1.19.0-rolling-weekly@sha256:e0498ad1438f1f5f14094b26bae8bfc2dc8614adc7565f1fb8835f84a3f113a6"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTPS}:6901"
    environment:
      - VNC_PW=${HTTP_PWD}
    shm_size: ${SHM_SIZE}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --insecure --fail --silent --show-error
          --user "kasm_user:$$VNC_PW"
          https://127.0.0.1:6901/
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    volumes:
      - "${APP_DATA_DIR}:/home/kasm-user"
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

services:
  photofield:
    image: "ghcr.io/smilyorg/photofield:v0.25.0@sha256:cd4fde4dc6297b20eedd14b6445ed62a5cc457fda5dcf4f6f500aeed406ec976"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_BIND_ADDRESS}:${PANEL_APP_PORT_HTTP}:8080"
    environment:
      - PHOTOFIELD_ADDRESS=:8080
      - PHOTOFIELD_DATA_DIR=/app/data
      - TZ=${TZ}
    volumes:
      - "${APP_DATA_DIR}:/app/data"
      - "${PHOTO_LIBRARY_DIR}:/app/photos:ro"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 15s
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

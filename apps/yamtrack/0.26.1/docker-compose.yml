services:
  yamtrack:
    image: "ghcr.io/fuzzygrim/yamtrack:0.26.1@sha256:2c4c8ef6b73ba00aeb3e7cda5a34751f01448034a23d2fbcc98e48e44d377bb8"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    depends_on:
      yamtrack-redis:
        condition: service_healthy
    networks:
      - 1panel-network
      - yamtrack-internal
    ports:
      - "${PANEL_APP_BIND_ADDRESS}:${PANEL_APP_PORT_HTTP}:8000"
    environment:
      - TZ=${YAMTRACK_TIMEZONE}
      - SECRET=${YAMTRACK_SECRET}
      - REDIS_URL=redis://yamtrack-redis:6379
      - REGISTRATION=${YAMTRACK_REGISTRATION}
      - PUID=1000
      - PGID=1000
      - SOCIAL_PROVIDERS=
      - SOCIALACCOUNT_ONLY=False
    volumes:
      - "${APP_DATA_DIR}/yamtrack:/yamtrack/db"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8000/health/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    labels:
      createdBy: "Apps"

  yamtrack-redis:
    image: "redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576"
    container_name: ${CONTAINER_NAME}-redis
    restart: unless-stopped
    networks:
      - yamtrack-internal
    volumes:
      - "${APP_DATA_DIR}/redis:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true
  yamtrack-internal:
    internal: true

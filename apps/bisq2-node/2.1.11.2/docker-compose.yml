services:
  server:
    image: "ghcr.io/bisq-network/bisq2-api:2.1.12.0@sha256:beba2f2db5aefca0f4b8d49285b105cb0b29d0eb0ed0f8136712aace0e167906"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    stop_grace_period: 1m
    mem_limit: 2g
    networks:
      - 1panel-network
    ports:
      - "127.0.0.1:${PANEL_APP_PORT_HTTP}:8091"
    environment:
      - PAIRING_TTL_SECONDS=${PAIRING_TTL_SECONDS}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:nodev,noexec,nosuid,size=256M
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /bin/bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090 &&
          exec 4<>/dev/tcp/127.0.0.1/8091'
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    volumes:
      - "${APP_DATA_DIR}:/data"
    labels:
      createdBy: "Apps"

  web:
    image: "ghcr.io/bisq-network/bisq2-api-web-ui:2.1.11.2@sha256:86b93c3b99661bed88011842b2e02504147546687af62b86fdd0a4a5e937add4"
    container_name: ${CONTAINER_NAME}-web
    restart: unless-stopped
    network_mode: "service:server"
    depends_on:
      - server
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:nodev,noexec,nosuid,size=64M
    volumes:
      - "${APP_DATA_DIR}:/data:ro"
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

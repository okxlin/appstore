services:
  whois:
    image: "jinzeyang/whois:v1.3.0"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_BIND_ADDRESS}:${PANEL_APP_PORT_HTTP}:8043"
    environment:
      - WHOIS_REDIS_ADDR=
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8043/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

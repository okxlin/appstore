services:
  wizarr:
    image: "ghcr.io/wizarrrr/wizarr:v2026.10.0@sha256:6ffcaa64f17c7c2fa9fc11b0b53b86c8309ebe081fc8ab4c9f31ae2c8d143bdd"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:5690"
    environment:
      - PUID=1000
      - PGID=1000
      - DISABLE_BUILTIN_AUTH=false
      - PORT=5690
      - TZ=${TIME_ZONE}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fs http://localhost:5690/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    volumes:
      - "${APP_DATA_DIR}:/data/database"
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

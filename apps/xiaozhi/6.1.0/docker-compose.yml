services:
  xiaozhi-redis:
    image: redis:7-alpine
    container_name: ${CONTAINER_NAME}-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

  xiaozhi-server:
    image: ghcr.io/joey-zhou/xiaozhi-server:6.1.0
    container_name: ${CONTAINER_NAME}-server
    restart: always
    ports:
      - "${PANEL_APP_PORT_API}:8091"
    environment:
      - "SPRING_PROFILES_ACTIVE=dev"
      - "SPRING_DATASOURCE_URL=jdbc:mysql://${PANEL_DB_HOST}:${PANEL_DB_PORT}/${PANEL_DB_NAME}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true"
      - "SPRING_DATASOURCE_USERNAME=${PANEL_DB_USER}"
      - "SPRING_DATASOURCE_PASSWORD=${PANEL_DB_USER_PASSWORD}"
      - "SPRING_DATA_REDIS_HOST=xiaozhi-redis"
      # 下发给设备的服务器 IP，留空则自动探测
      - "HOST_IP=${HOST_IP}"
      # 设备接入鉴权密钥，留空等于不设防
      - "XIAOZHI_DEVICE_AUTH_SECRET=${XIAOZHI_DEVICE_AUTH_SECRET}"
      - "TZ=${TZ}"
    volumes:
      - ./data/audio:/app/audio
      - ./data/uploads:/app/uploads
      - ./data/logs/server:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8091'"]
      interval: 15s
      timeout: 5s
      retries: 10
      # 首次启动要跑完 Flyway 建表
      start_period: 90s
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

  xiaozhi-dialogue:
    image: ghcr.io/joey-zhou/xiaozhi-dialogue:6.1.0
    container_name: ${CONTAINER_NAME}-dialogue
    restart: always
    ports:
      - "${PANEL_APP_PORT_WS}:8092"
    environment:
      - "SPRING_PROFILES_ACTIVE=dev"
      - "SPRING_DATASOURCE_URL=jdbc:mysql://${PANEL_DB_HOST}:${PANEL_DB_PORT}/${PANEL_DB_NAME}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true"
      - "SPRING_DATASOURCE_USERNAME=${PANEL_DB_USER}"
      - "SPRING_DATASOURCE_PASSWORD=${PANEL_DB_USER_PASSWORD}"
      - "SPRING_DATA_REDIS_HOST=xiaozhi-redis"
      - "HOST_IP=${HOST_IP}"
      - "XIAOZHI_DEVICE_AUTH_SECRET=${XIAOZHI_DEVICE_AUTH_SECRET}"
      - "TZ=${TZ}"
    volumes:
      # audio/uploads 必须与 server 共享，否则 TTS 缓存与上传文件互相读不到
      - ./data/audio:/app/audio
      - ./data/uploads:/app/uploads
      - ./data/logs/dialogue:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8092'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

  xiaozhi-web:
    image: ghcr.io/joey-zhou/xiaozhi-web:6.1.0
    container_name: ${CONTAINER_NAME}
    restart: always
    ports:
      - "${PANEL_APP_PORT_HTTP}:8084"
    environment:
      - "TZ=${TZ}"
    # 上游 nginx.conf 固定按 server/dialogue 服务名反代，这里挂载改写版，
    # 指向带 xiaozhi- 前缀的服务名，避免与 1panel-network 上其他应用撞名
    volumes:
      - ./conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8084/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

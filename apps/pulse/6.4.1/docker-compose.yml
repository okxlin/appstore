services:
  pulse:
    image: "docker.io/rcourtman/pulse:6.4.1@sha256:dbf010b4f2c245e8a7570aae9fb081c4f579e3e97343babc5985b125949f2bf9"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:7655"
    environment:
      - TZ=${PULSE_TIMEZONE}
      - PULSE_AUTH_USER=${PULSE_AUTH_USER}
      - PULSE_AUTH_PASS=${PULSE_AUTH_PASS}
      - PULSE_DATA_DIR=/data
      - PULSE_DOCKER=true
      - PULSE_DEPLOYMENT_METHOD=docker_compose
      - PULSE_TELEMETRY=${PULSE_TELEMETRY}
      - PULSE_DISABLE_DOCKER_UPDATE_ACTIONS=true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - "${APP_DATA_DIR}:/data"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/docker-healthcheck.sh"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

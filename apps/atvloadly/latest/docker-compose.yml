services:
  atvloadly:
    image: "bitxeno/atvloadly:latest"
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:80"
    volumes:
      - "${DATA_PATH}:/data"
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon:/var/run/avahi-daemon
    security_opt:
      - seccomp:unconfined
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

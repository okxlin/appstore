services:
  vlc-kasm:
    image: "kasmweb/vlc:1.19.0-rolling-weekly@sha256:477726494368cacafbaefcb25374c1cd0b965a0651289ace1f7c33e03ee8b00f"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTPS}:6901"
    environment:
      - VNC_PW=${HTTP_PWD}
    shm_size: ${SHM_SIZE}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --insecure --fail --silent --show-error
          --user "kasm_user:$$VNC_PW"
          https://127.0.0.1:6901/
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    volumes:
      - "${APP_DATA_DIR}:/home/kasm-user"
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

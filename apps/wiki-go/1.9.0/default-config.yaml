server:
    host: "0.0.0.0"
    port: 8080
    allow_insecure_cookies: true
    ssl: false
    ssl_cert: ""
    ssl_key: ""
wiki:
    root_dir: "data"
    documents_dir: "documents"
    title: "Wiki-Go"
    owner: "wiki.example.com"
    notice: "Copyright :::year::: All rights reserved."
    timezone: "Asia/Shanghai"
    private: false
    disable_comments: false
    disable_file_upload_checking: false
    enable_link_embedding: false
    hide_attachments: false
    disable_content_max_width: false
    always_open_children_in_sidebar: false
    max_versions: 10
    max_upload_size: 10
    language: "en"
    log_level: "info"
security:
    passwordstrength: 14
    login_ban:
        enabled: true
        max_failures: 5
        window_seconds: 180
        initial_ban_seconds: 60
        max_ban_seconds: 86400
users:
    - username: admin
      password: $2a$14$8ZJtOsMVd9moF06LVw84ae.71boNvc75VSjIoGBPhVbRV7gUbONTy
      role: admin
access_rules: []

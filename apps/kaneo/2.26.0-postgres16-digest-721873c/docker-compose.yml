services:
  kaneo-postgres:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    container_name: ${CONTAINER_NAME}-postgres
    restart: unless-stopped
    user: "70:70"
    networks:
      - kaneo-internal
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - "${APP_DATA_DIR}/postgres:/var/lib/postgresql/data"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /var/run/postgresql:uid=70,gid=70,mode=0755,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      createdBy: "Apps"

  kaneo:
    image: ghcr.io/usekaneo/kaneo:2.50.0@sha256:03ad082e33945b9c091266af60c7c88865cb2fab37ff33d91cbbcab626b0094d
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    user: "1001:1001"
    depends_on:
      kaneo-postgres:
        condition: service_healthy
    networks:
      - kaneo-internal
      - 1panel-network
    ports:
      - "${PANEL_APP_BIND_ADDRESS}:${PANEL_APP_PORT_HTTP}:5173"
    environment:
      KANEO_CLIENT_URL: ${KANEO_CLIENT_URL}
      POSTGRES_HOST: kaneo-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION}
    tmpfs:
      - /tmp:mode=1777,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    labels:
      createdBy: "Apps"

networks:
  kaneo-internal:
    internal: true
  1panel-network:
    external: true

additionalProperties:
  formFields:
    - default: 127.0.0.1
      edit: true
      envKey: PANEL_APP_BIND_ADDRESS
      labelEn: Bind Address
      labelZh: 绑定地址
      label:
        en: Bind Address
        zh: 绑定地址
        zh-Hant: 綁定位址
        ja: バインドアドレス
        ko: 바인드 주소
        ru: Адрес привязки
        ms: Alamat ikatan
        pt-br: Endereco de vinculacao
      required: true
      type: text
    - default: 5173
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: HTTP Port
      labelZh: HTTP 端口
      label:
        en: HTTP Port
        zh: HTTP 端口
        zh-Hant: HTTP 連接埠
        ja: HTTP ポート
        ko: HTTP 포트
        ru: HTTP-порт
        ms: Port HTTP
        pt-br: Porta HTTP
      required: true
      rule: paramPort
      type: number
    - default: http://localhost:5173
      edit: true
      envKey: KANEO_CLIENT_URL
      labelEn: Public URL
      labelZh: 公开访问地址
      label:
        en: Public URL
        zh: 公开访问地址
        zh-Hant: 公開存取網址
        ja: 公開 URL
        ko: 공개 URL
        ru: Публичный URL
        ms: URL awam
        pt-br: URL publica
      required: true
      type: text
    - default: "false"
      edit: true
      envKey: DISABLE_REGISTRATION
      labelEn: Disable Registration
      labelZh: 禁止新用户注册
      label:
        en: Disable Registration
        zh: 禁止新用户注册
        zh-Hant: 停用新使用者註冊
        ja: 新規登録を無効化
        ko: 신규 등록 비활성화
        ru: Отключить регистрацию
        ms: Nyahdayakan pendaftaran
        pt-br: Desativar cadastro
      required: true
      type: select
      values:
        - label: "false"
          value: "false"
        - label: "true"
          value: "true"
    - default: kaneo
      edit: true
      envKey: POSTGRES_DB
      labelEn: Database Name
      labelZh: 数据库名称
      label:
        en: Database Name
        zh: 数据库名称
        zh-Hant: 資料庫名稱
        ja: データベース名
        ko: 데이터베이스 이름
        ru: Имя базы данных
        ms: Nama pangkalan data
        pt-br: Nome do banco de dados
      random: true
      required: true
      rule: paramCommon
      type: text
    - default: kaneo
      edit: true
      envKey: POSTGRES_USER
      labelEn: Database User
      labelZh: 数据库用户
      label:
        en: Database User
        zh: 数据库用户
        zh-Hant: 資料庫使用者
        ja: データベースユーザー
        ko: 데이터베이스 사용자
        ru: Пользователь базы данных
        ms: Pengguna pangkalan data
        pt-br: Usuario do banco de dados
      random: true
      required: true
      rule: paramCommon
      type: text
    - default: generate
      edit: true
      envKey: POSTGRES_PASSWORD
      labelEn: Database Password
      labelZh: 数据库密码
      label:
        en: Database Password
        zh: 数据库密码
        zh-Hant: 資料庫密碼
        ja: データベースパスワード
        ko: 데이터베이스 비밀번호
        ru: Пароль базы данных
        ms: Kata laluan pangkalan data
        pt-br: Senha do banco de dados
      required: true
      type: password
    - default: generate
      edit: true
      envKey: AUTH_SECRET
      labelEn: Authentication Secret
      labelZh: 认证密钥
      label:
        en: Authentication Secret
        zh: 认证密钥
        zh-Hant: 驗證密鑰
        ja: 認証シークレット
        ko: 인증 비밀 키
        ru: Секрет аутентификации
        ms: Rahsia pengesahan
        pt-br: Segredo de autenticacao
      required: true
      type: password
    - default: ./data
      edit: true
      envKey: APP_DATA_DIR
      labelEn: Data Directory
      labelZh: 数据目录
      label:
        en: Data Directory
        zh: 数据目录
        zh-Hant: 資料目錄
        ja: データディレクトリ
        ko: 데이터 디렉터리
        ru: Каталог данных
        ms: Direktori data
        pt-br: Diretorio de dados
      required: true
      type: text

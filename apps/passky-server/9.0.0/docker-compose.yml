services:
  passky-server:
    image: "rabbitcompany/passky-server:9.0.0@sha256:c5229f4b88a47aaddd4e25eadea8a47331af3a8cae6b7a0bb176ef906849afd6"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:80"
    environment:
      - SERVER_LOCATION=US
      - SERVER_CORES=1
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CF_TURNSTILE_SITE_KEY=1x00000000000000000000AA
      - CF_TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
      - DATABASE_ENGINE=sqlite
      - DATABASE_FILE=passky
      - MYSQL_CACHE_MODE=0
      - MAIL_ENABLED=false
      - ACCOUNT_MAX=100
      - ACCOUNT_MAX_PASSWORDS=1000
      - ACCOUNT_PREMIUM=-1
      - LIMITER_ENABLED=true
      - PHP_DATE_TIMEZONE=${TIME_ZONE}
      - TZ=${TIME_ZONE}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:nodev,noexec,nosuid,mode=1777
    volumes:
      - "${APP_DATA_DIR}:/var/www/html/databases"
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

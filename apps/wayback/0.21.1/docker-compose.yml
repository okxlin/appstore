services:
  wayback:
    image: "wabarc/wayback:0.21.1@sha256:60cc26d4678462a866d34866d2f1d07c0419d4b87940640bdf2e3030e3b77a06"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    command: ["wayback", "--ia", "--is", "--ga", "-d", "web"]
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_BIND_ADDRESS}:${PANEL_APP_PORT_HTTP}:8964"
    user: "100:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - WAYBACK_LISTEN_ADDR=0.0.0.0:8964
      - WAYBACK_BOLT_PATH=/data/wayback.db
      - WAYBACK_POOLING_SIZE=${WAYBACK_POOLING_SIZE}
      - WAYBACK_TIMEOUT=${WAYBACK_TIMEOUT}
      - WAYBACK_MAX_MEDIA_SIZE=${WAYBACK_MAX_MEDIA_SIZE}
      - WAYBACK_ONION_DISABLED=true
    volumes:
      - "${DATA_PATH}:/data"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8964/healthcheck | grep -qx OK"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

services:
  leafwiki:
    image: "ghcr.io/perber/leafwiki:v0.13.0@sha256:c40904dafd9db81ca2c9334e8c67fb168d175876111fc1fd9a00e3715b66775b"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    init: true
    user: "1000:1000"
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8080"
    env_file:
      - path: "${APP_DATA_DIR}/.leafwiki-secrets.env"
        required: false
    environment:
      - LEAFWIKI_DATA_DIR=/app/data
      - LEAFWIKI_ADMIN_PASSWORD=${LEAFWIKI_ADMIN_PASSWORD}
      - LEAFWIKI_ADMIN_USERNAME=${LEAFWIKI_ADMIN_USERNAME}
      - LEAFWIKI_ADMIN_EMAIL=${LEAFWIKI_ADMIN_EMAIL}
      - LEAFWIKI_ALLOW_INSECURE=${LEAFWIKI_ALLOW_INSECURE}
      - LEAFWIKI_DISABLE_AUTH=false
      - LEAFWIKI_PUBLIC_ACCESS=false
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    volumes:
      - "${APP_DATA_DIR}:/app/data"
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

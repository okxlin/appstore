services:
  dokku:
    image: "dokku/dokku:0.38.34@sha256:b83dd87a4031b2a8b0d5e06a8d51f42ff99dffeb227da4185cfab2550925866c"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    network_mode: bridge
    environment:
      - DOKKU_HOSTNAME=${DOKKU_HOSTNAME}
      - DOKKU_HOST_ROOT=/var/lib/dokku/home/dokku
      - DOKKU_LIB_HOST_ROOT=/var/lib/dokku/var/lib/dokku
      - TZ=${TZ}
    volumes:
      - "/var/lib/dokku:/mnt/dokku"
      - "/var/run/docker.sock:/var/run/docker.sock"
    ports:
      - "${PANEL_APP_PORT_SSH}:22"
      - "${PANEL_APP_PORT_HTTP}:80"
      - "${PANEL_APP_PORT_HTTPS}:443"
    labels:
      createdBy: "Apps"

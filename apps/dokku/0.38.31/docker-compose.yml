services:
  dokku:
    image: "dokku/dokku:0.38.31@sha256:e86459ccbe2bf4c6730835aab87a111861b19b87c8141104b46e041fc5d9e3a7"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    network_mode: bridge
    environment:
      - DOKKU_HOSTNAME=${DOKKU_HOSTNAME}
      - DOKKU_HOST_ROOT=/var/lib/dokku/home/dokku
      - DOKKU_LIB_HOST_ROOT=/var/lib/dokku/var/lib/dokku
      - TZ=${TZ}
    volumes:
      - "/var/lib/dokku:/mnt/dokku"
      - "/var/run/docker.sock:/var/run/docker.sock"
    ports:
      - "${PANEL_APP_PORT_SSH}:22"
      - "${PANEL_APP_PORT_HTTP}:80"
      - "${PANEL_APP_PORT_HTTPS}:443"
    labels:
      createdBy: "Apps"

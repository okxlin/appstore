services:
  silverbullet:
    image: "ghcr.io/silverbulletmd/silverbullet:2.11.0@sha256:535efe0a5d97587593edd88dfd7b2523f7c3a11482aa5c75887cce64f741acfc"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    environment:
      SB_USER: "${SB_USERNAME}:${SB_PASSWORD}"
    volumes:
      - "${SPACE_DIR}:/space"
    ports:
      - "${PANEL_APP_PORT_HTTP}:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail http://127.0.0.1:3000/.instance || exit 1
      start_period: 15s
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      createdBy: "Apps"
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true

additionalProperties:
  formFields:
  - default: 127.0.0.1
    edit: true
    envKey: PANEL_APP_BIND_ADDRESS
    labelEn: Bind Address
    labelZh: 绑定地址
    label:
      en: Bind Address
      zh: 绑定地址
      zh-Hant: 綁定位址
      ja: バインドアドレス
      ko: 바인드 주소
      ru: Адрес привязки
      ms: Alamat ikatan
      pt-br: Endereco de vinculacao
    required: true
    type: text
  - default: 8080
    edit: true
    envKey: PANEL_APP_PORT_HTTP
    labelEn: HTTP Port
    labelZh: HTTP 端口
    label:
      en: HTTP Port
      zh: HTTP 端口
      zh-Hant: HTTP 埠
      ja: HTTP ポート
      ko: HTTP 포트
      ru: HTTP-порт
      ms: Port HTTP
      pt-br: Porta HTTP
    required: true
    rule: paramPort
    type: number
  - default: production
    edit: true
    envKey: SQLPAGE_ENVIRONMENT
    labelEn: Runtime Environment
    labelZh: 运行环境
    label:
      en: Runtime Environment
      zh: 运行环境
      zh-Hant: 執行環境
      ja: 実行環境
      ko: 실행 환경
      ru: Среда выполнения
      ms: Persekitaran masa jalan
      pt-br: Ambiente de execucao
    required: true
    type: select
    values:
    - label: production
      value: production
    - label: development
      value: development
  - default: sqlpage=info
    edit: true
    envKey: LOG_LEVEL
    labelEn: Log Level
    labelZh: 日志级别
    label:
      en: Log Level
      zh: 日志级别
      zh-Hant: 日誌級別
      ja: ログレベル
      ko: 로그 수준
      ru: Уровень журнала
      ms: Tahap log
      pt-br: Nivel de log
    required: true
    type: select
    values:
    - label: error
      value: sqlpage=error
    - label: warn
      value: sqlpage=warn
    - label: info
      value: sqlpage=info
    - label: debug
      value: sqlpage=debug
  - default: 'false'
    edit: true
    envKey: SQLPAGE_COMPRESS_RESPONSES
    labelEn: Compress Responses
    labelZh: 压缩响应
    label:
      en: Compress Responses
      zh: 压缩响应
      zh-Hant: 壓縮回應
      ja: レスポンスを圧縮
      ko: 응답 압축
      ru: Сжатие ответов
      ms: Mampatkan respons
      pt-br: Compactar respostas
    required: true
    type: select
    values:
    - label: 'false'
      value: 'false'
    - label: 'true'
      value: 'true'
  - default: 5242880
    edit: true
    envKey: SQLPAGE_MAX_UPLOADED_FILE_SIZE
    labelEn: Maximum Upload Size (bytes)
    labelZh: 最大上传大小（字节）
    label:
      en: Maximum Upload Size (bytes)
      zh: 最大上传大小（字节）
      zh-Hant: 最大上傳大小（位元組）
      ja: 最大アップロードサイズ（バイト）
      ko: 최대 업로드 크기(바이트)
      ru: Максимальный размер загрузки (байт)
      ms: Saiz muat naik maksimum (bait)
      pt-br: Tamanho maximo de upload (bytes)
    required: true
    type: number
  - default: ./data
    edit: true
    envKey: APP_DATA_DIR
    labelEn: Website Data Directory
    labelZh: 网站数据目录
    label:
      en: Website Data Directory
      zh: 网站数据目录
      zh-Hant: 網站資料目錄
      ja: Web サイトデータディレクトリ
      ko: 웹사이트 데이터 디렉터리
      ru: Каталог данных сайта
      ms: Direktori data laman web
      pt-br: Diretorio de dados do site
    required: true
    type: text
  - default: Asia/Shanghai
    edit: true
    envKey: TZ
    labelEn: Timezone
    labelZh: 时区
    label:
      en: Timezone
      zh: 时区
      zh-Hant: 時區
      ja: タイムゾーン
      ko: 시간대
      ru: Часовой пояс
      ms: Zon waktu
      pt-br: Fuso horário
    required: true
    type: text

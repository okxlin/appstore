services:
  privatebin:
    image: "privatebin/nginx-fpm-alpine:2.1.0@sha256:b221c93dea1610380c5a64ca0318d1447f5197f7a4fc790467eb14e25eb15ba7"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8080"
    environment:
      - TZ=${TZ}
      - PHP_TZ=${TZ}
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:nodev,noexec,mode=1777
      - /run:nodev,exec,mode=1777
      - /var/lib/nginx/tmp:nodev,noexec,mode=1777
    labels:
      createdBy: "Apps"
    volumes:
      - "${APP_DATA_DIR}:/srv/data"

networks:
  1panel-network:
    external: true

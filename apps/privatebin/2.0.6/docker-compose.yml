services:
  privatebin:
    image: "privatebin/nginx-fpm-alpine:2.1.1@sha256:9fbcc4d5671b974cafb55948d6fc3ab9eaf77f0c39271a50a16dd71bd4c4d3e6"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8080"
    environment:
      - TZ=${TZ}
      - PHP_TZ=${TZ}
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:nodev,noexec,mode=1777
      - /run:nodev,exec,mode=1777
      - /var/lib/nginx/tmp:nodev,noexec,mode=1777
    labels:
      createdBy: "Apps"
    volumes:
      - "${APP_DATA_DIR}:/srv/data"

networks:
  1panel-network:
    external: true

services:
  yopass:
    image: "jhaals/yopass:latest"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${PANEL_APP_PORT_HTTP}:1337"
    environment:
      - MEMCACHED=memcached:11211
      - PORT=1337
      - DEFAULT_EXPIRY=${YOPASS_DEFAULT_EXPIRY}
      - MAX_LENGTH=${YOPASS_MAX_LENGTH}
    depends_on:
      memcached:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/yopass-server", "--health-check"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - 1panel-network
      - yopass-internal
    labels:
      createdBy: "Apps"

  memcached:
    image: "memcached:alpine"
    restart: unless-stopped
    command:
      - memcached
      - -m
      - "${MEMCACHED_MEMORY_MB}"
    healthcheck:
      test: ["CMD-SHELL", "printf 'version\\r\\n' | nc -w 2 127.0.0.1 11211 | grep -q '^VERSION '"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - yopass-internal
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true
  yopass-internal:
    internal: true

additionalProperties:
  formFields:
    - default: 8086
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: HTTP Port
      labelZh: HTTP 端口
      label:
        en: HTTP Port
        zh: HTTP 端口
        zh-Hant: HTTP 連接埠
        ja: HTTP ポート
        ko: HTTP 포트
        ru: HTTP-порт
        ms: Port HTTP
        pt-br: Porta HTTP
      required: true
      rule: paramPort
      type: number
    - default: ""
      edit: true
      envKey: PANEL_DB_HOST
      key: postgresql
      labelEn: PostgreSQL Service
      labelZh: PostgreSQL 服务
      label:
        en: PostgreSQL Service
        zh: PostgreSQL 服务
        zh-Hant: PostgreSQL 服務
        ja: PostgreSQL サービス
        ko: PostgreSQL 서비스
        ru: Сервис PostgreSQL
        ms: Perkhidmatan PostgreSQL
        pt-br: Serviço PostgreSQL
      required: true
      type: service
    - default: 5432
      edit: true
      envKey: PANEL_DB_PORT
      labelEn: PostgreSQL Port
      labelZh: PostgreSQL 端口
      label:
        en: PostgreSQL Port
        zh: PostgreSQL 端口
        zh-Hant: PostgreSQL 連接埠
        ja: PostgreSQL ポート
        ko: PostgreSQL 포트
        ru: Порт PostgreSQL
        ms: Port PostgreSQL
        pt-br: Porta PostgreSQL
      required: true
      rule: paramPort
      type: number
    - default: oxicloud
      edit: true
      envKey: PANEL_DB_NAME
      labelEn: Database Name
      labelZh: 数据库名
      label:
        en: Database Name
        zh: 数据库名
        zh-Hant: 資料庫名稱
        ja: データベース名
        ko: 데이터베이스 이름
        ru: Имя базы данных
        ms: Nama pangkalan data
        pt-br: Nome do banco de dados
      random: true
      required: true
      rule: paramCommon
      type: text
    - default: oxicloud
      edit: true
      envKey: PANEL_DB_USER
      labelEn: Database User
      labelZh: 数据库用户
      label:
        en: Database User
        zh: 数据库用户
        zh-Hant: 資料庫使用者
        ja: データベースユーザー
        ko: 데이터베이스 사용자
        ru: Пользователь базы данных
        ms: Pengguna pangkalan data
        pt-br: Usuário do banco de dados
      random: true
      required: true
      rule: paramCommon
      type: text
    - default: oxicloud
      edit: true
      envKey: PANEL_DB_USER_PASSWORD
      labelEn: Database Password
      labelZh: 数据库密码
      label:
        en: Database Password
        zh: 数据库密码
        zh-Hant: 資料庫密碼
        ja: データベースパスワード
        ko: 데이터베이스 비밀번호
        ru: Пароль базы данных
        ms: Kata laluan pangkalan data
        pt-br: Senha do banco de dados
      random: true
      required: true
      rule: paramComplexity
      type: password
    - default: ./data
      edit: true
      envKey: APP_DATA_DIR
      labelEn: Data Directory
      labelZh: 数据目录
      label:
        en: Data Directory
        zh: 数据目录
        zh-Hant: 資料目錄
        ja: データディレクトリ
        ko: 데이터 디렉터리
        ru: Каталог данных
        ms: Direktori data
        pt-br: Diretório de dados
      required: true
      type: text
    - default: http://localhost:8086
      edit: true
      envKey: OXICLOUD_BASE_URL
      labelEn: Public Base URL
      labelZh: 公开访问地址
      label:
        en: Public Base URL
        zh: 公开访问地址
        zh-Hant: 公開存取網址
        ja: 公開ベース URL
        ko: 공개 기본 URL
        ru: Публичный базовый URL
        ms: URL asas awam
        pt-br: URL base pública
      required: true
      type: text
    - default: "false"
      edit: true
      envKey: OXICLOUD_DISABLE_REGISTRATION
      labelEn: Disable Registration
      labelZh: 禁止新用户注册
      label:
        en: Disable Registration
        zh: 禁止新用户注册
        zh-Hant: 停用新使用者註冊
        ja: 新規登録を無効化
        ko: 신규 등록 비활성화
        ru: Отключить регистрацию
        ms: Lumpuhkan pendaftaran
        pt-br: Desativar cadastro
      required: true
      type: select
      values:
        - label: "false"
          value: "false"
        - label: "true"
          value: "true"

additionalProperties:
  formFields:
    - default: 9042
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: HTTP Port
      labelZh: HTTP 端口
      label:
        en: HTTP Port
        zh: HTTP 端口
        zh-Hant: HTTP 連接埠
        ja: HTTP ポート
        ko: HTTP 포트
        ru: Порт HTTP
        ms: Port HTTP
        pt-br: Porta HTTP
      required: true
      rule: paramPort
      type: number
    - default: http://127.0.0.1:9042
      edit: true
      envKey: LIWAN_BASE_URL
      labelEn: Base URL
      labelZh: 基础访问地址
      label:
        en: Base URL
        zh: 基础访问地址
        zh-Hant: 基礎存取網址
        ja: ベース URL
        ko: 기본 URL
        ru: Базовый URL
        ms: URL asas
        pt-br: URL base
      required: true
      type: text
    - default: ./data
      edit: true
      envKey: LIWAN_HOST_DATA_DIR
      labelEn: Data Directory
      labelZh: 数据目录
      label:
        en: Data Directory
        zh: 数据目录
        zh-Hant: 資料目錄
        ja: データディレクトリ
        ko: 데이터 디렉터리
        ru: Каталог данных
        ms: Direktori data
        pt-br: Diretorio de dados
      required: true
      type: text
    - default: "false"
      edit: true
      envKey: LIWAN_DISABLE_FAVICONS
      labelEn: Disable Favicon Fetching
      labelZh: 禁用网站图标获取
      label:
        en: Disable Favicon Fetching
        zh: 禁用网站图标获取
        zh-Hant: 停用網站圖示擷取
        ja: ファビコン取得を無効化
        ko: 파비콘 가져오기 비활성화
        ru: Отключить загрузку значков сайтов
        ms: Lumpuhkan pengambilan ikon laman
        pt-br: Desativar busca de icones de sites
      required: true
      type: select
      values:
        - label: "Yes"
          value: "true"
        - label: "No"
          value: "false"

services:
  liwan:
    image: "ghcr.io/explodingcamera/liwan:1.7.0@sha256:992159faa3652d828b0ee0ebcb6d60feccc42a6be097e96a856ec44e26850a7e"
    container_name: ${CONTAINER_NAME}
    ports:
      - "${PANEL_APP_PORT_HTTP}:9042"
    environment:
      LIWAN_BASE_URL: "${LIWAN_BASE_URL}"
      LIWAN_LISTEN: "0.0.0.0:9042"
      LIWAN_DATA_DIR: /data
      LIWAN_DISABLE_FAVICONS: "${LIWAN_DISABLE_FAVICONS}"
    labels:
      createdBy: "Apps"
    restart: unless-stopped
    volumes:
      - "${LIWAN_HOST_DATA_DIR}:/data"
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true

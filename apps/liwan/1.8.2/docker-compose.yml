services:
  liwan:
    image: "ghcr.io/explodingcamera/liwan:1.8.2@sha256:a87a131a227b3dbdf1487b999aff35a605aeb37382a1e421b3c501924270db21"
    container_name: ${CONTAINER_NAME}
    ports:
      - "${PANEL_APP_PORT_HTTP}:9042"
    environment:
      LIWAN_BASE_URL: "${LIWAN_BASE_URL}"
      LIWAN_LISTEN: "0.0.0.0:9042"
      LIWAN_DATA_DIR: /data
      LIWAN_DISABLE_FAVICONS: "${LIWAN_DISABLE_FAVICONS}"
    labels:
      createdBy: "Apps"
    restart: unless-stopped
    volumes:
      - "${LIWAN_HOST_DATA_DIR}:/data"
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true

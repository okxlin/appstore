additionalProperties:
  formFields:
    - default: 8080
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: HTTP Port
      labelZh: HTTP 端口
      label:
        en: HTTP Port
        zh: HTTP 端口
        zh-Hant: HTTP 連接埠
        ja: HTTP ポート
        ko: HTTP 포트
        ru: HTTP-порт
        ms: Port HTTP
        pt-br: Porta HTTP
      required: true
      rule: paramPort
      type: number
    - default: ./data
      edit: true
      envKey: APP_DATA_DIR
      labelEn: Data Directory
      labelZh: 数据目录
      label:
        en: Data Directory
        zh: 数据目录
        zh-Hant: 資料目錄
        ja: データディレクトリ
        ko: 데이터 디렉터리
        ru: Каталог данных
        ms: Direktori data
        pt-br: Diretorio de dados
      required: true
      type: text
    - default: ""
      edit: true
      envKey: WT_JWT_ENCRYPTION_KEY
      labelEn: Session Encryption Key
      labelZh: 会话加密密钥
      label:
        en: Session Encryption Key
        zh: 会话加密密钥
        zh-Hant: 工作階段加密金鑰
        ja: セッション暗号化キー
        ko: 세션 암호화 키
        ru: Ключ шифрования сеансов
        ms: Kunci penyulitan sesi
        pt-br: Chave de criptografia da sessao
      random: true
      required: true
      rule: paramComplexity
      type: password
    - default: "false"
      edit: true
      envKey: WT_REGISTRATION_DISABLED
      labelEn: Disable Registration
      labelZh: 禁止用户注册
      label:
        en: Disable Registration
        zh: 禁止用户注册
        zh-Hant: 停用使用者註冊
        ja: ユーザー登録を無効化
        ko: 사용자 등록 비활성화
        ru: Отключить регистрацию
        ms: Nyahdayakan pendaftaran
        pt-br: Desativar cadastro
      required: true
      type: select
      values:
        - label: "false"
          value: "false"
        - label: "true"
          value: "true"
    - default: "false"
      edit: true
      envKey: WT_SOCIALS_DISABLED
      labelEn: Disable Social Features
      labelZh: 禁用社交功能
      label:
        en: Disable Social Features
        zh: 禁用社交功能
        zh-Hant: 停用社交功能
        ja: ソーシャル機能を無効化
        ko: 소셜 기능 비활성화
        ru: Отключить социальные функции
        ms: Nyahdayakan ciri sosial
        pt-br: Desativar recursos sociais
      required: true
      type: select
      values:
        - label: "false"
          value: "false"
        - label: "true"
          value: "true"
    - default: "false"
      edit: true
      envKey: WT_OFFLINE
      labelEn: Offline Mode
      labelZh: 离线模式
      label:
        en: Offline Mode
        zh: 离线模式
        zh-Hant: 離線模式
        ja: オフラインモード
        ko: 오프라인 모드
        ru: Автономный режим
        ms: Mod luar talian
        pt-br: Modo offline
      required: true
      type: select
      values:
        - label: "false"
          value: "false"
        - label: "true"
          value: "true"
    - default: Asia/Shanghai
      edit: true
      envKey: TZ
      labelEn: Timezone
      labelZh: 时区
      label:
        en: Timezone
        zh: 时区
        zh-Hant: 時區
        ja: タイムゾーン
        ko: 시간대
        ru: Часовой пояс
        ms: Zon waktu
        pt-br: Fuso horario
      required: true
      type: text

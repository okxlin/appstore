services:
  dbx:
    image: "t8y2/dbx@sha256:c86bfc6c244328d4ca229fe9c3bbc2f14c621ed0945cb5690e49526ef7ba1b7c"
    container_name: ${CONTAINER_NAME}
    ports:
      - "${PANEL_APP_PORT_HTTP}:4224"
    environment:
      - DBX_PASSWORD=${PANEL_DB_PASSWORD}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

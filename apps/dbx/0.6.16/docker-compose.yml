services:
  dbx:
    image: "t8y2/dbx@sha256:7e7e19cd72cd6321475b3ea5e75713823efaa7258ab6e6d92f7a5547e46c9e62"
    container_name: ${CONTAINER_NAME}
    ports:
      - "${PANEL_APP_PORT_HTTP}:4224"
    environment:
      - DBX_PASSWORD=${PANEL_DB_PASSWORD}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

services:
  dbx:
    image: "t8y2/dbx@sha256:0fe0ca0cdf6160003197b380ae5e88501843ab81bfc4b9dd0a378b3b9c93169b"
    container_name: ${CONTAINER_NAME}
    ports:
      - "${PANEL_APP_PORT_HTTP}:4224"
    environment:
      - DBX_PASSWORD=${PANEL_DB_PASSWORD}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

services:
  dbx:
    image: "t8y2/dbx@sha256:c3befad5e17a23595f84a06e6fe554d2856ed346e148b9cfeee8761dfcfe8c5e"
    container_name: ${CONTAINER_NAME}
    ports:
      - "${PANEL_APP_PORT_HTTP}:4224"
    environment:
      - DBX_PASSWORD=${PANEL_DB_PASSWORD}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

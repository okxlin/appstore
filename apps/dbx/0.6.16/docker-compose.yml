services:
  dbx:
    image: "t8y2/dbx@sha256:09d8c8b79fd7a4a370e6e37e299909c052af15d0d5cf2d84e8d940c110a530b2"
    container_name: ${CONTAINER_NAME}
    ports:
      - "${PANEL_APP_PORT_HTTP}:4224"
    environment:
      - DBX_PASSWORD=${PANEL_DB_PASSWORD}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

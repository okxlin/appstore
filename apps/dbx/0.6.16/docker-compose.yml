services:
  dbx:
    image: "t8y2/dbx@sha256:5d47cd5ba20faf16b7c67ecf01dcfa4ff3517f07f8ce50725462b3260b31c4c5"
    container_name: ${CONTAINER_NAME}
    ports:
      - "${PANEL_APP_PORT_HTTP}:4224"
    environment:
      - DBX_PASSWORD=${PANEL_DB_PASSWORD}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

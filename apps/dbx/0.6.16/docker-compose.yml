services:
  dbx:
    image: "t8y2/dbx@sha256:4c5a9a7abbc5a9ebb84d9ff257793f9351cd16acc2e71e2def0567ca931b86ab"
    container_name: ${CONTAINER_NAME}
    ports:
      - "${PANEL_APP_PORT_HTTP}:4224"
    environment:
      - DBX_PASSWORD=${PANEL_DB_PASSWORD}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

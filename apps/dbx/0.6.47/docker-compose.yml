services:
  dbx:
    image: "t8y2/dbx:0.6.62@sha256:c38a167b350c6268278c8f1a26f09c85be85dc2021277446aa5d5c75b56b6263"
    container_name: ${CONTAINER_NAME}
    ports:
      - "${PANEL_APP_PORT_HTTP}:4224"
    environment:
      - DBX_PASSWORD=${PANEL_DB_PASSWORD}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

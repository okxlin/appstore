services:
  dbx:
    image: "t8y2/dbx:0.6.71@sha256:c73fafcd77c793817fc146ddcedc4c34b39803d0c68583076e9d9ebef330c83c"
    container_name: ${CONTAINER_NAME}
    ports:
      - "${PANEL_APP_PORT_HTTP}:4224"
    environment:
      - DBX_PASSWORD=${PANEL_DB_PASSWORD}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

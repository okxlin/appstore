services:
  dbx:
    image: "t8y2/dbx:0.6.70@sha256:569686142bfe244e7fd30d73127c64f6fc3da70bd57ef4c19c90e190345a5659"
    container_name: ${CONTAINER_NAME}
    ports:
      - "${PANEL_APP_PORT_HTTP}:4224"
    environment:
      - DBX_PASSWORD=${PANEL_DB_PASSWORD}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

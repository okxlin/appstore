services:
  dbx:
    image: "t8y2/dbx:0.6.67@sha256:0fdaf801248c7155431d6d1d412f9f7cc9b79b955dc956571d8e9c03993c0020"
    container_name: ${CONTAINER_NAME}
    ports:
      - "${PANEL_APP_PORT_HTTP}:4224"
    environment:
      - DBX_PASSWORD=${PANEL_DB_PASSWORD}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

services:
  dbx:
    image: "t8y2/dbx:0.6.73@sha256:ca9e93fee911a1ecccea12e785bf5fa0dae077c574db075945ace3fc467ad858"
    container_name: ${CONTAINER_NAME}
    ports:
      - "${PANEL_APP_PORT_HTTP}:4224"
    environment:
      - DBX_PASSWORD=${PANEL_DB_PASSWORD}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

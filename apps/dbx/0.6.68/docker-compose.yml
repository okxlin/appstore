services:
  dbx:
    image: "t8y2/dbx:0.6.69@sha256:3f6eda9c55fc52bc65834a2a6a71ecdc5b47747d157aacfcedb3ba4c9f3ce570"
    container_name: ${CONTAINER_NAME}
    ports:
      - "${PANEL_APP_PORT_HTTP}:4224"
    environment:
      - DBX_PASSWORD=${PANEL_DB_PASSWORD}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

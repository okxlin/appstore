services:
  dbx:
    image: "t8y2/dbx:0.6.65@sha256:dcfb2d0d0ce4a7c510dbd173facfd6dc9c34c880a2133d3cf005dc29e413cb18"
    container_name: ${CONTAINER_NAME}
    ports:
      - "${PANEL_APP_PORT_HTTP}:4224"
    environment:
      - DBX_PASSWORD=${PANEL_DB_PASSWORD}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

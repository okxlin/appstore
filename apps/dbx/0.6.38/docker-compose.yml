services:
  dbx:
    image: "t8y2/dbx:0.6.47@sha256:bfe8b0cb7c0e99798c7fd2e72a9919ed94a567e8b7fd4a5f90e9c1ffb808931f"
    container_name: ${CONTAINER_NAME}
    ports:
      - "${PANEL_APP_PORT_HTTP}:4224"
    environment:
      - DBX_PASSWORD=${PANEL_DB_PASSWORD}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

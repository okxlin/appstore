services:
  mazanoke:
    image: "ghcr.io/civilblur/mazanoke:v1.1.7@sha256:296914fe6eda7fd80dae090c9ca6cf43ad4c3902a9a8b36ca78f13f6a90bc515"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:80"
    environment:
      - USERNAME=${MAZANOKE_USERNAME}
      - PASSWORD=${MAZANOKE_PASSWORD}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/assets/images/favicon-16x16.png"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

services:
  postman-kasm:
    image: "kasmweb/postman:1.19.0-rolling-weekly@sha256:e925967a86e33f1fae2a82260bbeba7f0fcb6bb4d5b21a5a1d357b4291a9fdc9"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTPS}:6901"
    environment:
      - VNC_PW=${HTTP_PWD}
    shm_size: ${SHM_SIZE}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --insecure --fail --silent --show-error
          --user "kasm_user:$$VNC_PW"
          https://127.0.0.1:6901/
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    volumes:
      - "${APP_DATA_DIR}:/home/kasm-user"
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

services:
  songloft:
    image: "songloft/songloft:2.11.0"
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:58091"
    volumes:
      - "${APP_DATA_DIR}:/app/data"
      - "${APP_MUSIC_DIR}:/app/music"
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - LISTEN_PORT=58091
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:58091/api/v1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

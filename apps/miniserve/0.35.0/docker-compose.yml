services:
  miniserve:
    image: svenstaro/miniserve:0.35.0
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8080"
    environment:
      MINISERVE_PATH: /data
      MINISERVE_PORT: "8080"
      MINISERVE_INTERFACE: 0.0.0.0
      MINISERVE_AUTH: "${MINISERVE_USERNAME}:${MINISERVE_PASSWORD}"
      MINISERVE_NO_SYMLINKS: "true"
      MINISERVE_VERBOSE: "true"
    volumes:
      - "${MOUNT_PATH}:/data:ro"
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

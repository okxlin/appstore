  shortDescZh: 监视容器镜像并通知可用更新
  shortDescEn: Monitor container images and notify about available updates
  description:
    en: Monitor container images and notify about available updates
    zh: 监视容器镜像并通知可用更新
    zh-Hant: 監視容器映像並通知可用更新
    ja: コンテナイメージを監視し、利用可能な更新を通知します
    ko: 컨테이너 이미지를 감시하고 사용 가능한 업데이트를 알립니다
    ru: Отслеживает образы контейнеров и уведомляет о доступных обновлениях
    ms: Pantau imej bekas dan maklumkan kemas kini yang tersedia
    pt-br: Monitora imagens de contêiner e notifica sobre atualizações disponíveis
    tr: Diun, Docker kapsayıcılarının kullandığı imajları denetler ve etiket veya özet değişikliklerini kaydedip bildirir. Varsayılan olarak yalnızca diun.enable=true etiketli kapsayıcıları izler; etiketsiz kapsayıcılar formdan etkinleştirilebilir.
    es-es: Diun comprueba las imágenes que utilizan los contenedores Docker y registra y notifica los cambios de etiquetas o resúmenes. De forma predeterminada, solo supervisa los contenedores con la etiqueta diun.enable=true; la supervisión de contenedores sin etiqueta puede activarse en el formulario.
    fa: Diun ایمیج‌های مورد استفاده کانتینرهای Docker را بررسی می‌کند و تغییر برچسب یا digest را ثبت و اعلام می‌کند. به‌طور پیش‌فرض فقط کانتینرهای دارای برچسب diun.enable=true را پایش می‌کند؛ پایش کانتینرهای بدون برچسب از فرم قابل فعال‌سازی است.
    lo: Diun ກວດສອບອິມເມຈທີ່ຄອນເທນເນີ Docker ໃຊ້ ແລະບັນທຶກພ້ອມແຈ້ງເມື່ອ tag ຫຼື digest ປ່ຽນ. ຕາມຄ່າເລີ່ມຕົ້ນຈະຕິດຕາມສະເພາະຄອນເທນເນີທີ່ມີປ້າຍ diun.enable=true; ສາມາດເປີດການຕິດຕາມຄອນເທນເນີທີ່ບໍ່ມີປ້າຍຜ່ານແບບຟອມ.

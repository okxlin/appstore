    - default: ""
      edit: true
      envKey: PANEL_DB_HOST
      key: postgresql
      labelEn: PostgreSQL Service
      labelZh: PostgreSQL 服务
      label:
        en: PostgreSQL Service
        zh: PostgreSQL 服务
        zh-Hant: PostgreSQL 服務
        ja: PostgreSQL サービス
        ko: PostgreSQL 서비스
        ru: Сервис PostgreSQL
        ms: Perkhidmatan PostgreSQL
        pt-br: Servico PostgreSQL
      required: true
      type: service
    - default: 5432
      edit: true
      envKey: PANEL_DB_PORT
      labelEn: PostgreSQL Port
      labelZh: PostgreSQL 端口
      label:
        en: PostgreSQL Port
        zh: PostgreSQL 端口
        zh-Hant: PostgreSQL 連接埠
        ja: PostgreSQL ポート
        ko: PostgreSQL 포트
        ru: Порт PostgreSQL
        ms: Port PostgreSQL
        pt-br: Porta PostgreSQL
      required: true
      rule: paramPort
      type: number

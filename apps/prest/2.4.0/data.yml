        ms: Pengguna pangkalan data
        pt-br: Usuario do banco de dados
      random: true
      required: true
      rule: paramCommon
      type: text
    - default: prest
      edit: true
      envKey: PANEL_DB_USER_PASSWORD
      labelEn: Database Password
      labelZh: 数据库密码
      label:
        en: Database Password
        zh: 数据库密码
        zh-Hant: 資料庫密碼
        ja: データベースパスワード
        ko: 데이터베이스 비밀번호
        ru: Пароль базы данных
        ms: Kata laluan pangkalan data
        pt-br: Senha do banco de dados
      random: true
      required: true
      rule: paramComplexity
      type: password
    - default: disable
      edit: true
      envKey: PREST_PG_SSL_MODE
      labelEn: PostgreSQL SSL Mode
      labelZh: PostgreSQL SSL 模式
      label:
        en: PostgreSQL SSL Mode
        zh: PostgreSQL SSL 模式
        zh-Hant: PostgreSQL SSL 模式
        ja: PostgreSQL SSL モード
        ko: PostgreSQL SSL 모드
        ru: Режим SSL PostgreSQL
        ms: Mod SSL PostgreSQL
        pt-br: Modo SSL do PostgreSQL
      required: true
      type: select
      values:
        - label: disable
          value: disable
        - label: require
          value: require
        - label: verify-ca
          value: verify-ca
        - label: verify-full
          value: verify-full
    - default: generate
      edit: true
      envKey: PREST_JWT_KEY
      labelEn: JWT Signing Key
      labelZh: JWT 签名密钥
      label:
        en: JWT Signing Key
        zh: JWT 签名密钥
        zh-Hant: JWT 簽章金鑰
        ja: JWT 署名キー
        ko: JWT 서명 키
        ru: Ключ подписи JWT
        ms: Kunci tandatangan JWT
        pt-br: Chave de assinatura JWT
      required: true
      type: password

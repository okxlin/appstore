services:
  meshchatx:
    image: "ghcr.io/quad4-software/meshchatx:v4.12.0@sha256:31e36bbe5b8f64cc07196cd4d75f690f582c1ebc0c24a835c7c1d492f6849c38"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    init: true
    user: "1000:1000"
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTPS}:8000"
    environment:
      - MESHCHAT_AUTH=true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
      - /home/meshchat:nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - "${APP_DATA_DIR}:/config"
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

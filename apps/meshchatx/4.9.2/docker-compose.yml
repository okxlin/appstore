services:
  meshchatx:
    image: "ghcr.io/quad4-software/meshchatx:v4.10.7@sha256:051f8169e0b2950327fbe19327b946f48085b9c91f82bf13e617d13a9591685b"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    init: true
    user: "1000:1000"
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTPS}:8000"
    environment:
      - MESHCHAT_AUTH=true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
      - /home/meshchat:nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - "${APP_DATA_DIR}:/config"
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

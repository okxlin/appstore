services:
  meshchatx:
    image: "ghcr.io/quad4-software/meshchatx:v4.9.2@sha256:054651aa0fd38c9f8e95aed49c66309e4db7cfd6c11d94f7a2a3eae7dee312c7"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    init: true
    user: "1000:1000"
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTPS}:8000"
    environment:
      - MESHCHAT_AUTH=true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
      - /home/meshchat:nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - "${APP_DATA_DIR}:/config"
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

services:
  meshchatx:
    image: "ghcr.io/quad4-software/meshchatx:v4.12.1@sha256:45a138723adcbd5eb65237573a965ff62cf8bbf4dbfa8e90cc92f491a0c92bbb"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    init: true
    user: "1000:1000"
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTPS}:8000"
    environment:
      - MESHCHAT_AUTH=true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
      - /home/meshchat:nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - "${APP_DATA_DIR}:/config"
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

services:
  meshchatx:
    image: "ghcr.io/quad4-software/meshchatx:v4.8.9@sha256:dfa72418dc68a560a88d21a7051b69266818074f7f8ba736f4dae6ff9d90ba3c"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    init: true
    user: "1000:1000"
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTPS}:8000"
    environment:
      - MESHCHAT_AUTH=true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
      - /home/meshchat:nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - "${APP_DATA_DIR}:/config"
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

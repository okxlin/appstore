services:
  chhoto-url:
    image: "sintan1729/chhoto-url:7.5.0"
    container_name: ${CONTAINER_NAME}
    restart: always
    tty: true
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:4567"
    environment:
      - CHHOTO_DB_URL=/data/urls.sqlite
      - CHHOTO_SQLITE_USE_WAL_MODE=True
      - CHHOTO_PASSWORD=${CHHOTO_PASSWORD}
      - CHHOTO_API_KEY=${CHHOTO_API_KEY}
      - CHHOTO_SITE_URL=${CHHOTO_SITE_URL}
      - CHHOTO_REDIRECT_METHOD=${CHHOTO_REDIRECT_METHOD}
      - CHHOTO_PUBLIC_MODE=Disable
      - CHHOTO_LISTEN_ADDRESS=0.0.0.0
      - CHHOTO_LISTEN_PORT=4567
    tmpfs:
      - /tmp:size=16m,mode=1777,uid=1000,gid=1000
    volumes:
      - "${APP_DATA_DIR}:/data"
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

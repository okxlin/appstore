services:
  milvus-etcd:
    image: "quay.io/coreos/etcd:v3.7.2"
    container_name: ${CONTAINER_NAME}-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./etcd-data:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - milvus-internal
    labels:
      createdBy: "Apps"

  milvus-minio:
    image: "quay.io/minio/minio:RELEASE.2024-05-28T17-19-04Z"
    container_name: ${CONTAINER_NAME}-minio
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    ports:
      - "${PANEL_APP_PORT_MINIO_CONSOLE}:9001"
      - "${PANEL_APP_PORT_MINIO_API}:9000"
    volumes:
      - ./minio-data:/minio_data
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - milvus-internal
    labels:
      createdBy: "Apps"

  standalone:
    image: "milvusdb/milvus:v3.0.2"
    container_name: ${CONTAINER_NAME}-standalone
    command: ["milvus", "run", "standalone"]
    security_opt:
      - "seccomp:unconfined"
    environment:
      - MINIO_REGION=us-east-1
      - ETCD_ENDPOINTS=milvus-etcd:2379
      - MINIO_ADDRESS=milvus-minio:9000
    volumes:
      - ./milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "${PANEL_APP_PORT_GRPC}:19530"
      - "${PANEL_APP_PORT_HTTP}:9091"
    depends_on:
      milvus-etcd:
        condition: service_started
      milvus-minio:
        condition: service_started
    networks:
      - milvus-internal
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  milvus-internal:
    internal: true
  1panel-network:
    external: true

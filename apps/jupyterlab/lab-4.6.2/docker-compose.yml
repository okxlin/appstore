services:
  jupyterlab:
    image: "quay.io/jupyter/base-notebook:lab-4.6.2@sha256:4d07369e1325dd155ee2710ca4f29b763f5562e2bbd2ccb0182b357c3c1b8526"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    user: "1000:100"
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8888"
    command:
      - start-notebook.py
      - --IdentityProvider.token=${JUPYTER_TOKEN}
      - --ServerApp.allow_remote_access=True
    environment:
      - TZ=${TZ}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - "${APP_DATA_DIR}:/home/jovyan/work"
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

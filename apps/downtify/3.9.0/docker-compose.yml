services:
  downtify:
    image: "ghcr.io/henriquesebastiao/downtify:3.9.0@sha256:663b2c3e193cd4f2792968071b45524316ad622c49abd54546531d69ab5ca2a0"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8000"
    environment:
      - DOWNTIFY_PORT=8000
      - HOME=/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - "${APP_DATA_DIR}:/data"
      - "${APP_DOWNLOADS_DIR}:/downloads"
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

additionalProperties:
  formFields:
    - default: 127.0.0.1
      edit: true
      envKey: PANEL_APP_BIND_ADDRESS
      labelEn: Bind Address
      labelZh: 绑定地址
      label:
        en: Bind Address
        zh: 绑定地址
        zh-Hant: 綁定位址
        ja: バインドアドレス
        ko: 바인드 주소
        ru: Адрес привязки
        ms: Alamat ikatan
        pt-br: Endereco de vinculacao
      required: true
      type: text
    - default: 5000
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: Registry Port
      labelZh: 仓库端口
      label:
        en: Registry Port
        zh: 仓库端口
        zh-Hant: 倉庫連接埠
        ja: レジストリポート
        ko: 레지스트리 포트
        ru: Порт реестра
        ms: Port pendaftar
        pt-br: Porta do registro
      required: true
      rule: paramPort
      type: number
    - default: ./data
      edit: true
      envKey: APP_DATA_DIR
      labelEn: Registry Data Directory
      labelZh: 仓库数据目录
      label:
        en: Registry Data Directory
        zh: 仓库数据目录
        zh-Hant: 倉庫資料目錄
        ja: レジストリデータディレクトリ
        ko: 레지스트리 데이터 디렉터리
        ru: Каталог данных реестра
        ms: Direktori data pendaftar
        pt-br: Diretorio de dados do registro
      required: true
      type: text
    - default: zotadmin
      edit: true
      envKey: ZOT_USERNAME
      labelEn: Registry Username
      labelZh: 仓库用户名
      label:
        en: Registry Username
        zh: 仓库用户名
        zh-Hant: 倉庫使用者名稱
        ja: レジストリユーザー名
        ko: 레지스트리 사용자 이름
        ru: Имя пользователя реестра
        ms: Nama pengguna pendaftar
        pt-br: Nome de usuario do registro
      required: true
      type: text
    - default: ZotRegistry1!ChangeMe
      edit: true
      envKey: ZOT_PASSWORD
      labelEn: Registry Password
      labelZh: 仓库密码
      label:
        en: Registry Password
        zh: 仓库密码
        zh-Hant: 倉庫密碼
        ja: レジストリパスワード
        ko: 레지스트리 비밀번호
        ru: Пароль реестра
        ms: Kata laluan pendaftar
        pt-br: Senha do registro
      random: true
      required: true
      rule: paramComplexity
      type: password
    - default: UTC
      edit: true
      envKey: TZ
      labelEn: Timezone
      labelZh: 时区
      label:
        en: Timezone
        zh: 时区
        zh-Hant: 時區
        ja: タイムゾーン
        ko: 시간대
        ru: Часовой пояс
        ms: Zon waktu
        pt-br: Fuso horario
      required: true
      type: text

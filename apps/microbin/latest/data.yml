additionalProperties:
  formFields:
    - default: 127.0.0.1
      edit: true
      envKey: PANEL_APP_BIND_ADDRESS
      labelEn: Bind Address
      labelZh: 绑定地址
      label:
        en: Bind Address
        zh: 绑定地址
        zh-Hant: 綁定位址
        ja: バインドアドレス
        ko: 바인드 주소
        ru: Адрес привязки
        ms: Alamat ikatan
        pt-br: Endereco de vinculacao
      required: true
      type: text
    - default: 8080
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: HTTP Port
      labelZh: HTTP 端口
      label:
        en: HTTP Port
        zh: HTTP 端口
        zh-Hant: HTTP 連接埠
        ja: HTTP ポート
        ko: HTTP 포트
        ru: HTTP-порт
        ms: Port HTTP
        pt-br: Porta HTTP
      required: true
      rule: paramPort
      type: number
    - default: admin
      edit: true
      envKey: MICROBIN_ADMIN_USERNAME
      labelEn: Administrator Username
      labelZh: 管理员用户名
      label:
        en: Administrator Username
        zh: 管理员用户名
        zh-Hant: 管理員使用者名稱
        ja: 管理者ユーザー名
        ko: 관리자 사용자 이름
        ru: Имя администратора
        ms: Nama pengguna pentadbir
        pt-br: Nome de usuario do administrador
      required: true
      rule: paramCommon
      type: text
    - default: generate
      edit: true
      envKey: MICROBIN_ADMIN_PASSWORD
      labelEn: Administrator Password
      labelZh: 管理员密码
      label:
        en: Administrator Password
        zh: 管理员密码
        zh-Hant: 管理員密碼
        ja: 管理者パスワード
        ko: 관리자 비밀번호
        ru: Пароль администратора
        ms: Kata laluan pentadbir
        pt-br: Senha do administrador
      required: true
      type: password
    - default: 256
      edit: true
      envKey: MICROBIN_MAX_FILE_SIZE_ENCRYPTED_MB
      labelEn: Encrypted File Limit (MB)
      labelZh: 加密文件上限 (MB)
      label:
        en: Encrypted File Limit (MB)
        zh: 加密文件上限 (MB)
        zh-Hant: 加密檔案上限 (MB)
        ja: 暗号化ファイル上限 (MB)
        ko: 암호화 파일 제한 (MB)
        ru: Лимит зашифрованного файла (МБ)
        ms: Had fail disulitkan (MB)
        pt-br: Limite de arquivo criptografado (MB)
      required: true
      type: number
    - default: 256
      edit: true
      envKey: MICROBIN_MAX_FILE_SIZE_UNENCRYPTED_MB
      labelEn: Unencrypted File Limit (MB)
      labelZh: 未加密文件上限 (MB)
      label:
        en: Unencrypted File Limit (MB)
        zh: 未加密文件上限 (MB)
        zh-Hant: 未加密檔案上限 (MB)

services:
  this-week-in-past:
    image: "rouhim/this-week-in-past:4.1.11@sha256:3ea74ba61c3fa8320b5305b43da2f20edd4c556705d3e7b58cf37bbe4270f32e"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    environment:
      - RESOURCE_PATHS=/resources
      - DATA_FOLDER=/data
      - PORT=8080
      - SLIDESHOW_INTERVAL=${SLIDESHOW_INTERVAL}
      - RANDOM_SLIDESHOW=${RANDOM_SLIDESHOW}
    ports:
      - "${PANEL_APP_PORT_HTTP}:8080"
    volumes:
      - "${PHOTO_LIBRARY_PATH}:/resources:ro"
      - "${APP_DATA_DIR}:/data"
    labels:
      createdBy: "Apps"
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true

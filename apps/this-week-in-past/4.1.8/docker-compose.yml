services:
  this-week-in-past:
    image: "rouhim/this-week-in-past:4.1.8@sha256:d8e491027f9bc9182139ecc51232538d43fc4ba9f6b33e585a8b66f5110cfe92"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    environment:
      - RESOURCE_PATHS=/resources
      - DATA_FOLDER=/data
      - PORT=8080
      - SLIDESHOW_INTERVAL=${SLIDESHOW_INTERVAL}
      - RANDOM_SLIDESHOW=${RANDOM_SLIDESHOW}
    ports:
      - "${PANEL_APP_PORT_HTTP}:8080"
    volumes:
      - "${PHOTO_LIBRARY_PATH}:/resources:ro"
      - "${APP_DATA_DIR}:/data"
    labels:
      createdBy: "Apps"
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true

services:
  homer:
    image: b4bz/homer:v26.4.2
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8080"
    environment:
      INIT_ASSETS: "1"
      IPV6_DISABLE: "1"
    volumes:
      - "./data/assets:/www/assets"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose -Y off --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

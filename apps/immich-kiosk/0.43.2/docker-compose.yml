services:
  immich-kiosk:
    image: "ghcr.io/damongolding/immich-kiosk:0.43.2@sha256:df06e9dc066f2c6a9cef10b37e34ad524a430412a7b21a02f6b300e4cf4ae104"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_BIND_ADDRESS}:${PANEL_APP_PORT_HTTP}:3000"
    environment:
      - LANG=en_US
      - TZ=${TIME_ZONE}
      - KIOSK_PORT=3000
      - KIOSK_IMMICH_URL=${KIOSK_IMMICH_URL}
      - KIOSK_IMMICH_API_KEY=${KIOSK_IMMICH_API_KEY}
      - KIOSK_IMMICH_EXTERNAL_URL=${KIOSK_IMMICH_EXTERNAL_URL}
      - KIOSK_DURATION=${KIOSK_DURATION}
      - KIOSK_ALBUMS=${KIOSK_ALBUMS}
      - KIOSK_SHOW_TIME=${KIOSK_SHOW_TIME}
      - KIOSK_LAYOUT=${KIOSK_LAYOUT}
      - KIOSK_BEHIND_PROXY=true
    healthcheck:
      test: ["CMD", "/kiosk", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      createdBy: Apps

networks:
  1panel-network:
    external: true

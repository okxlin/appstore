services:
  bentopdf:
    image: "ghcr.io/alam00000/bentopdf-simple:v2.8.7"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8080"
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

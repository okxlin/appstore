additionalProperties:
  formFields:
  - default: 127.0.0.1
    edit: true
    envKey: PANEL_APP_BIND_ADDRESS
    labelEn: Bind Address
    labelZh: 绑定地址
    label:
      en: Bind Address
      zh: 绑定地址
      zh-Hant: 綁定位址
      ja: バインドアドレス
      ko: 바인드 주소
      ru: Адрес привязки
      ms: Alamat ikatan
      pt-br: Endereco de vinculacao
    required: true
    type: text
  - default: 8000
    edit: true
    envKey: PANEL_APP_PORT_HTTP
    labelEn: HTTP Port
    labelZh: HTTP 端口
    label:
      en: HTTP Port
      zh: HTTP 端口
      zh-Hant: HTTP 連接埠
      ja: HTTP ポート
      ko: HTTP 포트
      ru: HTTP-порт
      ms: Port HTTP
      pt-br: Porta HTTP
    required: true
    rule: paramPort
    type: number
  - default: postgresql
    envKey: PANEL_DB_TYPE
    labelEn: Database Runtime
    labelZh: 数据库运行环境
    label:
      en: Database Runtime
      zh: 数据库运行环境
      zh-Hant: 資料庫執行環境
      ja: データベース実行環境
      ko: 데이터베이스 런타임
      ru: Среда базы данных
      ms: Masa jalan pangkalan data
      pt-br: Ambiente de banco de dados
    required: true
    type: apps
    values:
    - label: PostgreSQL
      value: postgresql
    child:
      default: ''
      envKey: PANEL_DB_HOST
      labelEn: PostgreSQL Service
      labelZh: PostgreSQL 服务
      label:
        en: PostgreSQL Service
        zh: PostgreSQL 服务
        zh-Hant: PostgreSQL 服務
        ja: PostgreSQL サービス
        ko: PostgreSQL 서비스
        ru: Сервис PostgreSQL
        ms: Perkhidmatan PostgreSQL
        pt-br: Servico PostgreSQL
      required: true
      type: service
  - default: 5432
    edit: false
    envKey: PANEL_DB_PORT
    labelEn: Database Port
    labelZh: 数据库端口
    label:
      en: Database Port
      zh: 数据库端口
      zh-Hant: 資料庫連接埠
      ja: データベースポート
      ko: 데이터베이스 포트
      ru: Порт базы данных
      ms: Port pangkalan data
      pt-br: Porta do banco de dados
    required: true
    type: number
  - default: flagsmith
    edit: false
    envKey: PANEL_DB_NAME
    labelEn: Database Name
    labelZh: 数据库名称
    label:
      en: Database Name
      zh: 数据库名称
      zh-Hant: 資料庫名稱
      ja: データベース名
      ko: 데이터베이스 이름
      ru: Имя базы данных
      ms: Nama pangkalan data
      pt-br: Nome do banco de dados
    random: true
    required: true
    rule: paramCommon
    type: text
  - default: flagsmith
    edit: false
    envKey: PANEL_DB_USER
    labelEn: Database User
    labelZh: 数据库用户
    label:
      en: Database User
      zh: 数据库用户
      zh-Hant: 資料庫使用者
      ja: データベースユーザー
      ko: 데이터베이스 사용자
      ru: Пользователь базы данных
      ms: Pengguna pangkalan data
      pt-br: Usuario do banco de dados
    random: true
    required: true
    rule: paramCommon
    type: text
  - default: ''
    edit: false
    envKey: PANEL_DB_USER_PASSWORD
    labelEn: Database Password
    labelZh: 数据库密码
    label:
      en: Database Password
      zh: 数据库密码
      zh-Hant: 資料庫密碼
      ja: データベースパスワード
      ko: 데이터베이스 비밀번호
      ru: Пароль базы данных
      ms: Kata laluan pangkalan data
      pt-br: Senha do banco de dados
    required: true
    rule: paramComplexity
    type: password
  - default: generate
    edit: true
    envKey: DJANGO_SECRET_KEY
    labelEn: Application Secret
    labelZh: 应用密钥
    label:
      en: Application Secret
      zh: 应用密钥
      zh-Hant: 應用程式密鑰
      ja: アプリケーションシークレット
      ko: 애플리케이션 비밀 키
      ru: Секрет приложения
      ms: Rahsia aplikasi
      pt-br: Segredo do aplicativo
    required: true
    type: password
  - default: localhost:8000
    edit: true
    envKey: FLAGSMITH_DOMAIN
    labelEn: Public Host
    labelZh: 公开访问主机
    label:
      en: Public Host
      zh: 公开访问主机
      zh-Hant: 公開存取主機
      ja: 公開ホスト
      ko: 공개 호스트
      ru: Публичный хост
      ms: Hos awam
      pt-br: Host publico
    required: true
    type: text
  - default: '*'
    edit: true
    envKey: FLAGSMITH_ALLOWED_HOSTS
    labelEn: Allowed Hosts
    labelZh: 允许的主机
    label:
      en: Allowed Hosts
      zh: 允许的主机
      zh-Hant: 允許的主機
      ja: 許可するホスト
      ko: 허용된 호스트
      ru: Разрешенные хосты
      ms: Hos yang dibenarkan
      pt-br: Hosts permitidos
    required: true
    type: text
  - default: 'false'
    edit: true
    envKey: PREVENT_SIGNUP
    labelEn: Prevent New Signups
    labelZh: 禁止新用户注册
    label:
      en: Prevent New Signups
      zh: 禁止新用户注册
      zh-Hant: 禁止新使用者註冊
      ja: 新規登録を禁止
      ko: 신규 가입 방지
      ru: Запретить новые регистрации
      ms: Halang pendaftaran baharu
      pt-br: Impedir novos cadastros
    required: true
    type: select
    values:
    - label: 'false'
      value: 'false'
    - label: 'true'
      value: 'true'

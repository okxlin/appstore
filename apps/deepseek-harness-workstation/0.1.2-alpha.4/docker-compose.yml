services:
  deepseek-harness-workstation:
    image: "ghcr.io/okxlin/deepseek-harness:0.1.2-alpha.4-workstation"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    labels:
      createdBy: "Apps"
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - PUBLIC_URL=${DSH_PUBLIC_URL}
      - AUTH_MODE=caddy-security
      - AUTH_USERNAME=${DSH_AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${DSH_AUTH_PASSWORD}
      - AUTH_TOKEN_LIFETIME=${DSH_AUTH_TOKEN_LIFETIME:-604800}
      - CADDY_TRUSTED_PROXIES=${CADDY_TRUSTED_PROXIES:-private_ranges}
      - AUTH_COOKIE_INSECURE=false
      - DSH_TRUSTED_HOSTS=${DSH_TRUSTED_HOSTS:-}
      - PORT=8080
      - DSH_TELEMETRY_DISABLED=1
    ports:
      - "${PANEL_APP_PORT_HTTP}:8080"
    volumes:
      - ./data/data:/data
      - dsh-home:/home/node
      - ./data/workspace:/workspace
      - "${DOCKER_SOCK_PATH:-/dev/null}:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true

volumes:
  dsh-home:
    name: dsh-home

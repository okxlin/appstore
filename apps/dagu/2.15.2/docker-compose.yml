services:
  dagu:
    image: "ghcr.io/dagucloud/dagu:2.15.3"
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8080"
    environment:
      - DAGU_HOST=0.0.0.0
      - DAGU_PORT=8080
      - DAGU_HOME=/var/lib/dagu
      - DAGU_TZ=${DAGU_TZ}
      - DAGU_AUTH_MODE=builtin
      - PUID=1000
      - PGID=1000
      - DOCKER_GID=-1
    volumes:
      - "${APP_DATA_DIR}:/var/lib/dagu"
    command:
      - dagu
      - start-all
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

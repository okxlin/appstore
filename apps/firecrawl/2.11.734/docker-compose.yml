services:
  firecrawl:
    image: "ghcr.io/firecrawl/firecrawl:2.11.734@sha256:bdc0be13192f8890bb1ffb8549626bf4095d7804d9fb052327eff83b8839fb8b"
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
      - firecrawl-backend
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PANEL_APP_PORT_HTTP}:3002"
    environment:
      - REDIS_URL=redis://firecrawl-redis:6379
      - REDIS_RATE_LIMIT_URL=redis://firecrawl-redis:6379
      - PLAYWRIGHT_MICROSERVICE_URL=http://firecrawl-playwright:3000/scrape
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres
      - POSTGRES_HOST=firecrawl-postgres
      - POSTGRES_PORT=5432
      - USE_DB_AUTHENTICATION=false
      - NUM_WORKERS_PER_QUEUE=${NUM_WORKERS_PER_QUEUE}
      - CRAWL_CONCURRENT_REQUESTS=${CRAWL_CONCURRENT_REQUESTS}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS}
      - BROWSER_POOL_SIZE=${BROWSER_POOL_SIZE}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - NUQ_BACKEND=pg
      - HOST=0.0.0.0
      - PORT=3002
      - EXTRACT_WORKER_PORT=3004
      - WORKER_PORT=3005
      - NUQ_RABBITMQ_URL=amqp://firecrawl-rabbitmq:5672
      - HARNESS_STARTUP_TIMEOUT_MS=60000
      - ENV=local
    depends_on:
      firecrawl-redis:
        condition: service_started
      firecrawl-playwright:
        condition: service_started
      firecrawl-rabbitmq:
        condition: service_healthy
      firecrawl-postgres:
        condition: service_healthy
    command: ["node", "dist/src/harness.js", "--start-docker"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    labels:
      createdBy: "Apps"

  firecrawl-playwright:
    image: "ghcr.io/firecrawl/playwright-service@sha256:637fb8c8399634b02c2179da72566ce11644435e5d93e895bdbde4b1f9b0882a"
    container_name: ${CONTAINER_NAME}-playwright
    restart: always
    networks:
      - firecrawl-backend
    environment:
      - PORT=3000
      - ALLOW_LOCAL_WEBHOOKS=false
      - BLOCK_MEDIA=false
      - MAX_CONCURRENT_PAGES=${CRAWL_CONCURRENT_REQUESTS}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    labels:
      createdBy: "Apps"

  firecrawl-redis:
    image: "redis:alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80"
    container_name: ${CONTAINER_NAME}-redis
    restart: always
    networks:
      - firecrawl-backend
    command: ["redis-server", "--bind", "0.0.0.0"]
    volumes:
      - ./data/redis:/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"
    labels:
      createdBy: "Apps"

  firecrawl-rabbitmq:
    image: "rabbitmq:4-management@sha256:af6f50d38098d8bd52fef7f3fa85015dd8b2bf6def58e995bf584ae9ba0f6407"
    container_name: ${CONTAINER_NAME}-rabbitmq
    restart: always
    networks:
      - firecrawl-backend
    command: ["rabbitmq-server"]
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"
    labels:
      createdBy: "Apps"

  firecrawl-postgres:
    image: "ghcr.io/firecrawl/nuq-postgres@sha256:d719b36160eac2fcbe16dc7e7360ddb9c82c40ea5da183d07bf4a755c6a0b2ae"
    container_name: ${CONTAINER_NAME}-postgres
    restart: always
    networks:
      - firecrawl-backend
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true
  firecrawl-backend:
    driver: bridge

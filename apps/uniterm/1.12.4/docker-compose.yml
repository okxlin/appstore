services:
  uniterm:
    image: uniterm/uniterm:1.12.4
    container_name: "${CONTAINER_NAME}"
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8080"
    environment:
      UNITERM_DATA_DIR: /data
      UNITERM_GATEWAY_ADDR: 0.0.0.0:8080
      UNITERM_ADMIN_USER: "${UNITERM_ADMIN_USER}"
      UNITERM_ADMIN_PASSWORD: "${UNITERM_ADMIN_PASSWORD}"
      UNITERM_WORKER_IDLE_MINUTES: "${UNITERM_WORKER_IDLE_MINUTES}"
      UNITERM_COOKIE_SECURE: "${UNITERM_COOKIE_SECURE}"
      UNITERM_ALLOWED_ORIGINS: "${UNITERM_ALLOWED_ORIGINS}"
      UNITERM_DOCKER_SOCKET_SOURCE: "${UNITERM_DOCKER_SOCKET_SOURCE:-./data/docker.sock.disabled}"
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
      - "${UNITERM_DOCKER_SOCKET_SOURCE:-./data/docker.sock.disabled}:/var/run/docker.sock"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        if [ "${UNITERM_DOCKER_SOCKET_SOURCE:-./data/docker.sock.disabled}" = "/var/run/docker.sock" ] && ! command -v docker >/dev/null 2>&1; then
          if ! apk add --no-cache docker-cli; then
            echo "[uniterm] WARNING: failed to install docker-cli; host Docker management is unavailable" >&2
          fi
        fi
        exec /app/uniterm-gateway
    healthcheck:
      test:
        - CMD
        - wget
        - "-q"
        - "--spider"
        - http://127.0.0.1:8080/health
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true

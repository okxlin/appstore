services:
  ddns-go:
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:9876"
    volumes:
      - "${DATA_PATH}:/root"
    image: jeessy/ddns-go:latest
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

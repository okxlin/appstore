services:
  mediamtx:
    image: "bluenviron/mediamtx:latest"
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_RTSP}:8554/tcp"
    environment:
      - MTX_RTSPTRANSPORTS=tcp
      - MTX_RTMP=false
      - MTX_HLS=false
      - MTX_WEBRTC=false
      - MTX_SRT=false
      - MTX_MOQ=false
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

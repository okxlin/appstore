services:
  hermitstash:
    image: "ghcr.io/dotcoocoo/hermitstash:1.15.6@sha256:54516bb2b03593775ffbf61c87ebab3b041cad90388d4d36ced26babbe7985fc"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    init: true
    user: "1000:1000"
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:3000"
    environment:
      - NODE_ENV=production
      - HERMITSTASH_TMPDIR=/dev/shm
      - PORT=3000
      - LOCAL_AUTH=true
      - REGISTRATION_OPEN=false
      - PUBLIC_UPLOAD=false
      - PASSKEY_ENABLED=true
      - CA_KEY_SEALED=auto
      - TLS_KEY_SEALED=auto
    shm_size: 256m
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - "${APP_DATA_DIR}:/app/data"
      - "${APP_UPLOADS_DIR}:/app/uploads"
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

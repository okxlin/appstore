        ms: Direktori podcast
        pt-br: Diretorio de podcasts
      required: true
      type: text
    - default: ./data/db
      edit: true
      envKey: DATABASE_DIR
      labelEn: Database Directory
      labelZh: 数据库目录
      label:
        en: Database Directory
        zh: 数据库目录
        zh-Hant: 資料庫目錄
        ja: データベースディレクトリ
        ko: 데이터베이스 디렉터리
        ru: Каталог базы данных
        ms: Direktori pangkalan data
        pt-br: Diretorio do banco de dados
      required: true
      type: text

services:
  podfetch:
    image: "docker.io/samuel19982/podfetch:v5.2.3@sha256:76aa17f25ebe70a336b5ce37ba2826e705dc40ca20359ac237b00e67127143be"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_BIND_ADDRESS}:${PANEL_APP_PORT_HTTP}:8000"
    environment:
      - PORT=8000
      - POLLING_INTERVAL=${POLLING_INTERVAL}
      - DATABASE_URL=sqlite:///app/db/podcast.db
      - PODFETCH_FOLDER=/app/podcasts
      - BASIC_AUTH=${BASIC_AUTH}
      - USERNAME=${PODFETCH_USERNAME}
      - PASSWORD=${PODFETCH_PASSWORD}
    volumes:
      - "${PODCASTS_DIR}:/app/podcasts"
      - "${DATABASE_DIR}:/app/db"
    labels:
      createdBy: Apps

networks:
  1panel-network:
    external: true

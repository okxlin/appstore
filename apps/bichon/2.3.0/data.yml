additionalProperties:
  formFields:
    - default: 15630
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: HTTP Port
      labelZh: HTTP 端口
      label:
        en: HTTP Port
        zh: HTTP 端口
        zh-Hant: HTTP 埠
        ja: HTTP ポート
        ko: HTTP 포트
        ru: HTTP-порт
        ms: Port HTTP
        pt-br: Porta HTTP
      required: true
      rule: paramPort
      type: number
    - default: ./data
      edit: true
      envKey: APP_DATA_DIR
      labelEn: Data Directory
      labelZh: 数据目录
      label:
        en: Data Directory
        zh: 数据目录
        zh-Hant: 資料目錄
        ja: データディレクトリ
        ko: 데이터 디렉터리
        ru: Каталог данных
        ms: Direktori data
        pt-br: Diretorio de dados
      required: true
      type: text
    - edit: true
      envKey: BICHON_ENCRYPT_PASSWORD
      labelEn: Encryption Password
      labelZh: 加密密码
      label:
        en: Encryption Password
        zh: 加密密码
        zh-Hant: 加密密碼
        ja: 暗号化パスワード
        ko: 암호화 비밀번호
        ru: Пароль шифрования
        ms: Kata laluan penyulitan
        pt-br: Senha de criptografia
      random: true
      required: true
      rule: paramComplexity
      type: password
    - default: ""
      edit: true
      envKey: BICHON_PUBLIC_URL
      labelEn: Public URL
      labelZh: 公开访问地址
      label:
        en: Public URL
        zh: 公开访问地址
        zh-Hant: 公開存取位址
        ja: 公開 URL
        ko: 공개 URL
        ru: Публичный URL
        ms: URL awam
        pt-br: URL publico
      required: false
      type: text
    - default: info
      edit: true
      envKey: BICHON_LOG_LEVEL
      labelEn: Log Level
      labelZh: 日志级别
      label:
        en: Log Level
        zh: 日志级别
        zh-Hant: 日誌層級
        ja: ログレベル
        ko: 로그 수준
        ru: Уровень журнала
        ms: Tahap log
        pt-br: Nivel de log
      required: true
      type: select
      values:
        - label: trace
          value: trace
        - label: debug
          value: debug
        - label: info
          value: info
        - label: warn
          value: warn
        - label: error
          value: error

services:
  kanboard:
    image: "kanboard/kanboard:latest"
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:80"
    environment:
      - TZ=${TZ}
    volumes:
      - "${APP_DATA_DIR}:/var/www/app/data"
      - "${APP_PLUGINS_DIR}:/var/www/app/plugins"
      - "${APP_CERTS_DIR}:/etc/nginx/ssl"
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

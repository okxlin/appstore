services:
  actual-budget:
    image: "actualbudget/actual-server:26.8.1@sha256:6478d9ddfc0924479c09e6699c205e354c6f2216dfe7de3c0fb7b590d6edcdc5"
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    user: "1001:1001"
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:5006"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - "${APP_DATA_DIR}:/data"
    healthcheck:
      test: ["CMD-SHELL", "node scripts/health-check.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

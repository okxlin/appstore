additionalProperties:
  formFields:
    - default: postgresql
      edit: true
      envKey: PANEL_DB_TYPE
      labelEn: PostgreSQL service (migrate legacy MySQL/MariaDB data before upgrading)
      labelZh: PostgreSQL 服务（MySQL/MariaDB 老用户升级前请先迁移数据）
      label:
        en: 'PostgreSQL service (migrate legacy MySQL/MariaDB data before upgrading)'
        zh: 'PostgreSQL 服务（MySQL/MariaDB 老用户升级前请先迁移数据）'
        zh-Hant: 'PostgreSQL 服務（MySQL/MariaDB 舊用戶升級前須先遷移資料庫）'
        ja: 'PostgreSQL サービス（MySQL/MariaDB の既存データはアップグレード前に移行してください）'
        ko: 'PostgreSQL 서비스 (기존 MySQL/MariaDB 데이터는 업그레이드 전에 마이그레이션해야 합니다)'
        ru: 'Сервис PostgreSQL (перенесите данные MySQL/MariaDB перед обновлением)'
        ms: 'Perkhidmatan PostgreSQL (pindahkan data MySQL/MariaDB sebelum naik taraf)'
        pt-br: 'Serviço PostgreSQL (migre os dados MySQL/MariaDB antes de atualizar)'
        tr: 'PostgreSQL hizmeti (yükseltmeden önce eski MySQL/MariaDB verilerini taşıyın)'
        es-es: 'Servicio PostgreSQL (migra los datos antiguos de MySQL/MariaDB antes de actualizar)'
        fa: 'سرویس PostgreSQL (پیش از ارتقا داده‌های MySQL/MariaDB را منتقل کنید)'
        lo: 'ບໍລິການ PostgreSQL (ຍ້າຍຂໍ້ມູນ MySQL/MariaDB ກ່ອນອັບເກຣດ)'
      params:
        - envKey: PANEL_DB_PORT
          key: postgresql
          type: param
          value: "5432"
      required: true
      type: apps
      values:
        - label: "PostgreSQL"
          value: postgresql
      child:
        default: ""
        edit: true
        envKey: PANEL_DB_HOST
        required: true
        type: service
    - default: passwordpusher
      edit: true
      envKey: PANEL_DB_NAME
      labelEn: Database
      labelZh: 数据库名
      label:
        en: 'Database'
        zh: '数据库名'
        zh-Hant: '數據庫名'
        ja: 'データベース'
        ko: '데이터베이스'
        ru: 'База данных'
        ms: 'Pangkalan Data'
        pt-br: 'Banco de Dados'
        tr: 'Veritabanı'
        es-es: 'Base de datos'
        fa: 'پایگاه داده'
        lo: 'ຖານຂໍ້ມູນ'
      random: true
      required: true
      rule: paramCommon
      type: text
    - default: passwordpusher
      edit: true
      envKey: PANEL_DB_USER
      labelEn: User
      labelZh: 数据库用户
      label:
        en: 'User'
        zh: '数据库用户'
        zh-Hant: '數據庫用戶'
        ja: 'ユーザー'
        ko: '사용자'
        ru: 'Пользователь'
        ms: 'Pengguna'
        pt-br: 'Usuário'
        tr: 'Kullanıcı'
        es-es: 'Usuario'
        fa: 'کاربر'
        lo: 'ຜູ້ໃຊ້'
      random: true
      required: true
      rule: paramCommon
      type: text
    - default: passwordpusher
      edit: true
      envKey: PANEL_DB_USER_PASSWORD
      labelEn: Password (letters, numbers, dot, underscore, hyphen only)
      labelZh: 密码（仅使用字母、数字、点、下划线和连字符）
      label:
        en: 'Password (letters, numbers, dot, underscore, hyphen only)'
        zh: '密码（仅使用字母、数字、点、下划线和连字符）'
        zh-Hant: '數據庫用戶密碼'
        ja: 'パスワード'
        ko: '비밀번호'
        ru: 'Пароль'
        ms: 'Kata laluan'
        pt-br: 'Senha'
        tr: 'Parola (yalnızca harf, rakam, nokta, alt çizgi ve tire)'
        es-es: 'Contraseña (solo letras, números, punto, guion bajo y guion)'
        fa: 'گذرواژه (فقط حروف، اعداد، نقطه، زیرخط و خط تیره)'
        lo: 'ລະຫັດຜ່ານ (ໃຊ້ສະເພາະຕົວອັກສອນ, ຕົວເລກ, ຈຸດ, ຂີດລຸ່ມ ແລະ ຂີດກາງ)'
      random: true
      required: true
      rule: paramCommon
      type: password
    - default: ""
      edit: true
      envKey: PWPUSH_MASTER_KEY
      labelEn: Custom encryption key (optional; preserve the existing value)
      labelZh: 自定义加密密钥（可选；老用户必须保留原值）
      label:
        en: 'Custom encryption key (optional; preserve the existing value)'
        zh: '自定义加密密钥（可选；老用户必须保留原值）'
        zh-Hant: '自訂加密金鑰（選填；舊用戶必須保留原值）'
        ja: 'カスタム暗号化キー（任意。既存ユーザーは同じ値を保持してください）'
        ko: '사용자 지정 암호화 키 (선택 사항; 기존 사용자는 기존 값을 유지하세요)'
        ru: 'Собственный ключ шифрования (необязательно; сохраните прежнее значение)'
        ms: 'Kunci penyulitan tersuai (pilihan; kekalkan nilai sedia ada)'
        pt-br: 'Chave de criptografia personalizada (opcional; mantenha o valor existente)'
        tr: 'Özel şifreleme anahtarı (isteğe bağlı; mevcut değeri koruyun)'
        es-es: 'Clave de cifrado personalizada (opcional; conserva el valor existente)'
        fa: 'کلید رمزگذاری سفارشی (اختیاری؛ مقدار قبلی را حفظ کنید)'
        lo: 'ຄີເຂົ້າລະຫັດກຳນົດເອງ (ບໍ່ບັງຄັບ; ໃຫ້ຄົງຄ່າເດີມໄວ້)'
      required: false
      type: password
    - default: 40180
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: Port
      labelZh: 端口
      label:
        en: 'Port'
        zh: '端口'
        zh-Hant: '埠'
        ja: 'ポート'
        ko: '포트'
        ru: 'Порт'
        ms: 'Port'
        pt-br: 'Porta'
        tr: 'Bağlantı noktası'
        es-es: 'Puerto'
        fa: 'درگاه'
        lo: 'ພອດ'
      required: true
      rule: paramPort
      type: number

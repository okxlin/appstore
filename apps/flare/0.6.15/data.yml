additionalProperties:
  formFields:
    - default: 5005
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: Web port
      labelZh: Web 端口
      label:
        en: Web port
        zh: Web 端口
        zh-Hant: Web 連接埠
        ja: Web ポート
        ko: Web 포트
        ru: Веб-порт
        ms: Port web
        pt-br: Porta web
      required: true
      rule: paramPort
      type: number
    - default: flare
      edit: true
      envKey: FLARE_USER
      labelEn: Login username
      labelZh: 登录用户名
      label:
        en: Login username
        zh: 登录用户名
        zh-Hant: 登入使用者名稱
        ja: ログインユーザー名
        ko: 로그인 사용자 이름
